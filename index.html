    <script>
        // Tu configuración de Firebase
        window.firebaseConfig = {
          apiKey: "AIzaSyA5N0yQQfPDfLKCkEbzUPHMMU-IJc6hCdA",
          authDomain: "app-de-ejercicio-a99db.firebaseapp.com",
          projectId: "app-de-ejercicio-a99db",
          storageBucket: "app-de-ejercicio-a99db.firebasestorage.app",
          messagingSenderId: "74777587908",
          appId: "1:74777587908:web:9ec006c45230a7e91c1991",
          measurementId: "G-XKXCW6P675"
        };

        window.START_DATE = new Date("2026-08-18T00:00:00");
        window.END_DATE = new Date("2026-10-30T00:00:00");
        window.TODAY = new Date();

        window.appState = {
            currentTab: 'home',
            allUsers: [],
            userData: null
        };

        window.showToast = function(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-sm font-bold shadow-lg z-50 animate-fade-in ${type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        };

        window.switchTab = function(tabId, userId = null) {
            window.appState.currentTab = tabId;
            if(userId) {
                window.appState.userData = window.appState.allUsers.find(u => u.id === userId);
            } else if (tabId === 'home') {
                window.appState.userData = null; 
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.add('text-blue-500');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-blue-500');
                    btn.classList.add('text-slate-500');
                }
            });
            if(window.renderApp) window.renderApp();
        };

        window.currentLoginUserId = null;

        // Modales de Seguridad
        window.promptPin = function(userId) {
            window.currentLoginUserId = userId;
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
        };

        window.closePinModal = function() {
            const modal = document.getElementById('pin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.currentLoginUserId = null;
        };

        window.verifyPin = function() {
            const pin = document.getElementById('login-pin').value;
            if(pin === '13579') { // CLAVE ADMIN
                window.closePinModal();
                window.switchTab('admin');
                return;
            }
            const user = window.appState.allUsers.find(u => u.id === window.currentLoginUserId);
            if(user && user.pin === pin) {
                window.closePinModal();
                window.switchTab('profile', user.id);
            } else {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
            }
        };

        window.promptAdminPin = function() {
            window.currentLoginUserId = null;
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const app = initializeApp(window.firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        window.db = db; 

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                listenToParticipants();
            } else {
                signInAnonymously(auth).catch(error => {
                    console.error("Auth error", error);
                    window.showToast("Error de conexión. Verifica Auth Anónimo en Firebase.", "error");
                });
            }
        });

        function listenToParticipants() {
            const competitorsRef = collection(db, 'competitors');
            onSnapshot(competitorsRef, (snapshot) => {
                const users = [];
                snapshot.forEach(doc => {
                    users.push({ id: doc.id, ...doc.data() });
                });
                window.appState.allUsers = users;
                
                if(window.appState.userData) {
                    window.appState.userData = users.find(u => u.id === window.appState.userData.id);
                }
                if(window.renderApp) window.renderApp();
            }, (error) => {
                console.error("Error leyendo DB:", error);
            });
        }

        window.processRegistration = async function() {
            const name = document.getElementById('reg-name').value;
            const weight = parseFloat(document.getElementById('reg-weight').value);
            const height = parseFloat(document.getElementById('reg-height').value);
            const pin = document.getElementById('reg-pin').value;

            if(!name || !weight || !height || !pin) return window.showToast("Completa todos los campos", "error");
            if(pin.length !== 4) return window.showToast("El PIN debe ser de 4 dígitos", "error");

            const heightInMeters = height > 3 ? height / 100 : height;
            const imc = (weight / (heightInMeters * heightInMeters)).toFixed(1);
            const group = imc >= 25 ? 'A (Quemar)' : 'B (Volumen)';

            const newUserId = "user_" + Date.now();
            const newUserData = {
                id: newUserId,
                name: name,
                startWeight: weight,
                height: height,
                imc: parseFloat(imc),
                group: group,
                pin: pin.toString(),
                trainingDays: [],
                videos: { real: false, ropa: false },
                createdAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, 'competitors', newUserId), newUserData);
                window.showToast(`¡${name} inscrito correctamente!`);
                window.switchTab('home');
            } catch (error) {
                console.error("Error", error);
                window.showToast("Error guardando en Firestore.", "error");
            }
        };

        // Lógica de Webcam en Vivo para evitar galerías
        let activeCameraCallback = null;

        window.openWebcamModal = function(callback) {
            activeCameraCallback = callback;
            const modal = document.getElementById('webcam-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(stream => {
                    window.localStream = stream;
                    const video = document.getElementById('webcam-video');
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => {
                    console.error("Webcam error:", err);
                    window.showToast("Debes dar permiso de cámara para participar.", "error");
                    window.closeWebcamModal();
                });
        };

        window.closeWebcamModal = function() {
            if(window.localStream) {
                window.localStream.getTracks().forEach(track => track.stop());
                window.localStream = null;
            }
            const modal = document.getElementById('webcam-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            activeCameraCallback = null;
        };

        window.captureWebcamSnapshot = function() {
            window.showToast("Procesando evidencia de sudor... ⏳", "success");
            setTimeout(async () => {
                if(activeCameraCallback) {
                    await activeCameraCallback();
                }
                window.closeWebcamModal();
            }, 800);
        };

        window.handleLiveCapture = function(type, userId) {
            window.openWebcamModal(async () => {
                try {
                    const userRef = doc(window.db, 'competitors', userId);
                    if (type === 'daily') {
                        const todayStr = new Date().toISOString().split('T')[0];
                        const user = window.appState.allUsers.find(u => u.id === userId);
                        if(user.trainingDays && user.trainingDays.includes(todayStr)) {
                            return window.showToast("Ya registraste tu entreno hoy.", "error");
                        }
                        await updateDoc(userRef, { trainingDays: arrayUnion(todayStr) });
                        window.showToast("¡Día Registrado! +1 Punto 🔥", "success");
                    } else if (type === 'real' || type === 'ropa') {
                        await updateDoc(userRef, { [`videos.${type}`]: true });
                        window.showToast("¡Evidencia Guardada! 📸", "success");
                    }
                } catch (error) {
                    console.error("Save error", error);
                    window.showToast("Error de conexión.", "error");
                }
            });
        };

        // Panel Administrador (Edición y Borrado Real)
        window.deleteCompetitor = async function(userId) {
            if(confirm("¿Seguro que deseas ELIMINAR a este competidor del Olimpo?")) {
                try {
                    await deleteDoc(doc(window.db, 'competitors', userId));
                    window.appState.allUsers = window.appState.allUsers.filter(u => u.id !== userId);
                    window.renderApp(); 
                    window.showToast("Competidor borrado exitosamente.", "success");
                } catch(e) {
                    console.error("Error deleting", e);
                    window.showToast("Error al eliminar competidor.", "error");
                }
            }
        };

        window.openEditModal = function(userId) {
            const user = window.appState.allUsers.find(u => u.id === userId);
            if(!user) return;
            window.editingUserId = userId;
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-pin').value = user.pin;
            document.getElementById('edit-weight').value = user.startWeight;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditModal = function() {
            window.editingUserId = null;
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.saveEditModal = async function() {
            if(!window.editingUserId) return;
            const newName = document.getElementById('edit-name').value;
            const newPin = document.getElementById('edit-pin').value;
            const newWeight = document.getElementById('edit-weight').value;

            try {
                await updateDoc(doc(window.db, 'competitors', window.editingUserId), {
                    name: newName,
                    pin: newPin,
                    startWeight: parseFloat(newWeight)
                });
                window.showToast("Datos actualizados correctamente.", "success");
                window.closeEditModal();
            } catch (error) {
                window.showToast("Error actualizando datos.", "error");
            }
        };
    </script>

    <script>
        window.renderApp = function() {
            const main = document.getElementById('main-content');
            const diff = window.END_DATE - window.TODAY;
            const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').textContent = `${daysLeft > 0 ? daysLeft : 0} Días`;

            switch(window.appState.currentTab) {
                case 'home': renderDashboard(main); break;
                case 'onboarding': renderOnboarding(main); break;
                case 'profile': renderProfile(main); break;
                case 'ranking': renderRanking(main); break;
                case 'retos': renderRetos(main); break;
                case 'bases': renderBases(main); break;
                case 'admin': renderAdmin(main); break;
                default: renderDashboard(main);
            }
            if(window.lucide) window.lucide.createIcons();
        };

        function renderDashboard(container) {
            let html = `
                <div class="animate-fade-in pb-4">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-black text-white">Competidores</h2>
                            <p class="text-xs text-slate-400">Toca tu nombre para entrar y sudar</p>
                        </div>
                        <button onclick="window.switchTab('onboarding')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 font-bold text-sm">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Añadir
                        </button>
                    </div>
            `;

            if(window.appState.allUsers.length === 0) {
                html += `
                    <div class="h-64 flex flex-col items-center justify-center text-center p-6 border-2 border-dashed border-slate-700 rounded-2xl">
                        <div class="bg-slate-800 p-4 rounded-full mb-4">
                            <i data-lucide="users" class="w-10 h-10 text-slate-400"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Ningún espartano aún</h3>
                        <button onclick="window.switchTab('onboarding')" class="px-6 py-3 bg-white text-black font-bold rounded-full shadow-lg mt-2">Inscribir al primero</button>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 gap-3">`;
                window.appState.allUsers.forEach(user => {
                    const days = user.trainingDays ? user.trainingDays.length : 0;
                    const imcColor = user.group.includes('A') ? 'text-red-400' : 'text-emerald-400';
                    
                    html += `
                        <div onclick="window.promptPin('${user.id}')" class="glass-panel p-4 rounded-2xl flex items-center justify-between cursor-pointer border border-slate-700/50 hover:border-blue-500 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center border border-slate-600 text-xl font-black text-white shadow-inner">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg text-white leading-none">${user.name}</h3>
                                    <div class="flex gap-2 mt-2">
                                        <span class="text-[9px] bg-blue-900/40 border border-blue-500/30 px-2 py-0.5 rounded text-blue-300 font-bold">Gpo ${user.group.charAt(0)}</span>
                                        <span class="text-[9px] bg-slate-800 border border-slate-600 px-2 py-0.5 rounded ${imcColor} font-bold">IMC ${user.imc}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right flex flex-col items-end">
                                <div class="font-black text-2xl text-white leading-none">${days}</div>
                                <div class="text-[8px] uppercase font-black tracking-widest text-slate-500 mt-1">Pts</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html + `</div>`;
        }

        function renderOnboarding(container) {
            container.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl animate-fade-in border border-slate-700/50">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="window.switchTab('home')" class="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <h2 class="text-xl font-black text-white">Nuevo Competidor</h2>
                        <div class="w-9"></div>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nombre o Apodo</label>
                            <input type="text" id="reg-name" placeholder="Ej: Manuel..." class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Peso (Kg)</label>
                                <input type="number" id="reg-weight" step="0.1" placeholder="Ej: 85.5" class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Altura (Metros)</label>
                                <input type="number" id="reg-height" step="0.01" placeholder="Ej: 1.75" class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-1">

                            </label>
                            <input type="password" id="reg-pin" inputmode="numeric" maxlength="4" placeholder="••••" class="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl px-4 py-3 text-center text-xl tracking-[0.5em] font-black focus:outline-none focus:border-blue-500">

                    </div>
                    <button onclick="window.processRegistration()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-8 shadow-lg shadow-blue-900/50 flex justify-center items-center gap-2 text-lg">
                        Inscribirse al Reto
                    </button>
                </div>
            `;
        }

        function renderProfile(container) {
            const user = window.appState.userData;
            if(!user) return window.switchTab('home');

            const videoRealDone = user.videos && user.videos.real;
            const videoRopaDone = user.videos && user.videos.ropa;
            const points = user.trainingDays ? user.trainingDays.length : 0;

            const year = 2026;
            const month = window.TODAY.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();

            let calendarGridHtml = '';
            const weekDays = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
            weekDays.forEach(d => {
                calendarGridHtml += `<div class="text-[10px] font-black text-slate-500 text-center py-1">${d}</div>`;
            });

            let offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 
            for(let i = 0; i < offset; i++) {
                calendarGridHtml += `<div></div>`;
            }

            for(let day = 1; day <= daysInMonth; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;
                const trained = user.trainingDays && user.trainingDays.includes(dateKey);

                calendarGridHtml += `
                    <div class="h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold relative border ${trained ? 'bg-blue-600 border-blue-400 text-white shadow-lg' : 'bg-slate-900/40 border-slate-800 text-slate-400'}">
                        <span>${day}</span>
                        ${trained ? '<span class="absolute -bottom-1 -right-1 text-sm drop-shadow-md">🏋️</span>' : ''}
                    </div>
                `;
            }

            const mesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            container.innerHTML = `
                <div class="animate-fade-in pb-8">
                    <button onclick="window.switchTab('home')" class="mb-4 flex items-center gap-2 text-sm text-slate-400 font-bold hover:text-white">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
                    </button>

                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-3xl border border-slate-700 mb-6 shadow-xl relative overflow-hidden">
                        <div class="flex justify-between items-start mb-1 relative z-10">
                            <div>
                                <h2 class="text-3xl font-black text-white leading-tight">${user.name}</h2>
                                <div class="flex gap-2 mt-2">
                                    <span class="bg-blue-600/20 text-blue-400 text-[10px] px-2 py-1 rounded border border-blue-500/20 font-bold uppercase">Gpo: ${user.group}</span>
                                    <span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-1 rounded font-bold uppercase">${user.startWeight} Kg</span>
                                </div>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-center shadow-inner">
                                <div class="text-3xl font-black text-blue-500 leading-none">${points}</div>
                                <div class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mt-1">PTS</div>
                            </div>
                        </div>

                        <div class="mt-6 pt-6 border-t border-slate-700/50 relative z-10">
                            <p class="text-xs text-slate-400 mb-3 text-center font-bold">Registro Diario Anti-Trampas (Solo WebCam)</p>
                            <button onclick="window.handleLiveCapture('daily', '${user.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-lg flex justify-center items-center gap-3 active:scale-95 transition-all border border-emerald-400/50">
                                <i data-lucide="camera" class="w-6 h-6"></i> TOMAR FOTO SUDANDO (+1 PT)
                            </button>
                        </div>
                    </div>

                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-3 ml-1 flex items-center gap-2">
                        <i data-lucide="calendar-days" class="w-4 h-4"></i> Calendario de Constancia
                    </h3>
                    <div class="glass-panel p-4 rounded-2xl border border-slate-700/50 mb-6">
                        <div class="text-sm font-bold text-white mb-3 text-center tracking-wider uppercase">${mesNombres[month]} ${year}</div>
                        <div class="grid grid-cols-7 gap-1.5">
                            ${calendarGridHtml}
                        </div>
                    </div>

                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-3 ml-1 flex items-center gap-2">
                        <i data-lucide="video" class="w-4 h-4"></i> Pruebas de Control
                    </h3>
                    <div class="space-y-3">
                        <div class="glass-panel p-4 rounded-2xl flex items-center justify-between border ${!videoRealDone ? 'border-red-500/30 bg-red-900/10' : 'border-emerald-500/30 bg-emerald-900/10'}">
                            <div>
                                <h4 class="font-bold text-white text-sm">Video "Realidad"</h4>
                                <p class="text-[10px] text-slate-400">Sin polo (Giro 360°)</p>
                            </div>
                            ${!videoRealDone ? `
                                <button onclick="window.handleLiveCapture('real', '${user.id}')" class="px-4 py-2 rounded-xl font-bold text-xs bg-red-500/20 text-red-400 border border-red-500/50 flex items-center gap-2">
                                    <i data-lucide="video" class="w-4 h-4"></i> Grabar
                                </button>
                            ` : `<span class="text-emerald-400 text-xs font-bold flex items-center gap-1"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Listo</span>`}
                        </div>

                        <div class="glass-panel p-4 rounded-2xl flex items-center justify-between border ${!videoRopaDone ? 'border-orange-500/30 bg-orange-900/10' : 'border-emerald-500/30 bg-emerald-900/10'}">
                            <div>
                                <h4 class="font-bold text-white text-sm">Video "Ropa Control"</h4>
                                <p class="text-[10px] text-slate-400">Prenda mal ajustada</p>
                            </div>
                            ${!videoRopaDone ? `
                                <button onclick="window.handleLiveCapture('ropa', '${user.id}')" class="px-4 py-2 rounded-xl font-bold text-xs bg-orange-500/20 text-orange-400 border border-orange-500/50 flex items-center gap-2">
                                    <i data-lucide="video" class="w-4 h-4"></i> Grabar
                                </button>
                            ` : `<span class="text-emerald-400 text-xs font-bold flex items-center gap-1"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Listo</span>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBases(container) {
            container.innerHTML = `
                <div class="animate-fade-in pb-8">
                    <h2 class="text-2xl font-black text-white mb-1 text-center mt-2">Bases Oficiales</h2>
                    <p class="text-xs text-blue-400 font-bold text-center mb-6 uppercase tracking-widest">YA NO QUIERO ESTAR COMO EL CHULO</p>
                    
                    <div class="space-y-4">
                        <div class="glass-panel p-5 rounded-2xl border border-slate-700/50">
                            <h3 class="text-lg font-black text-white mb-2 flex items-center gap-2"><span class="bg-blue-600 w-6 h-6 flex items-center justify-center rounded-full text-xs">1</span> El Sudor Diario</h3>
                            <p class="text-sm text-blue-400 font-bold">+1 Pto por día entrenado.</p>
                            <p class="text-xs text-slate-400 mt-2">Cámara en vivo obligatoria. La galería está prohibida. Auditoría final el 30 Oct. Si se detecta trampa: <span class="text-red-400 font-bold">-2 Puntos</span>.</p>
                        </div>

                        <div class="glass-panel p-5 rounded-2xl border border-slate-700/50">
                            <h3 class="text-lg font-black text-white mb-2 flex items-center gap-2"><span class="bg-blue-600 w-6 h-6 flex items-center justify-center rounded-full text-xs">2</span> Categorías de Peso</h3>
                            <p class="text-xs text-slate-300 mb-3">La app calcula tu porcentaje de mejora (PCP) según tu IMC inicial.</p>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700">
                                    <div class="text-[10px] font-bold text-red-400 mb-1">GRUPO A (Bajar)</div>
                                    <div class="text-[10px] text-white">3% a 5% = +10 Pts</div>
                                    <div class="text-[10px] text-white">5% a 8% = +15 Pts</div>
                                    <div class="text-[10px] text-white">> 8% = +20 Pts</div>
                                </div>
                                <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700">
                                    <div class="text-[10px] font-bold text-emerald-400 mb-1">GRUPO B (Subir)</div>
                                    <div class="text-[10px] text-white">2% a 4% = +15 Pts</div>
                                    <div class="text-[10px] text-white">> 4% = +10 Pts</div>
                                </div>
                            </div>
                        </div>

                        <div class="glass-panel p-5 rounded-2xl border border-slate-700/50">
                            <h3 class="text-lg font-black text-white mb-2 flex items-center gap-2"><span class="bg-blue-600 w-6 h-6 flex items-center justify-center rounded-full text-xs">3</span> Los Videos Visuales</h3>
                            <ul class="text-xs text-slate-400 space-y-2">
                                <li><strong>Set 1 Realidad:</strong> Sin polo en short. Giro de 360 grados.</li>
                                <li><strong>Set 2 Control:</strong> Usar la misma ropa mal ajustada (1 polo, 1 pantalón) en el video inicial y final.</li>
                            </ul>
                        </div>

                        <div class="glass-panel p-5 rounded-2xl border border-blue-500/50 bg-blue-900/10">
                            <h3 class="text-lg font-black text-blue-400 mb-2 flex items-center gap-2"><span class="bg-blue-600 text-white w-6 h-6 flex items-center justify-center rounded-full text-xs">4</span> La Gran Final</h3>
                            <ul class="text-xs text-white space-y-2">
                                <li>👁️ <strong>Votación:</strong> Todos votan del 1 al 5 el cambio visual de los compañeros.</li>
                                <li>🏆 <strong>Ganadores:</strong> La suma total define el Top 3.</li>
                                <li>💀 <strong>Penitencia:</strong> Los últimos 2 lugares pagan el castigo.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRetos(container) {
            container.innerHTML = `
                <div class="animate-fade-in pb-6">
                    <h2 class="text-2xl font-black text-white mb-1 text-center mt-2">Reto Semanal</h2>
                    <p class="text-xs text-slate-400 text-center mb-6">Demuestra tu disciplina alimenticia.</p>
                    
                    <div class="space-y-4">
                        <div class="glass-panel p-6 rounded-3xl border-2 border-emerald-500/50 relative overflow-hidden bg-emerald-900/10 shadow-lg shadow-emerald-900/20">
                            <div class="absolute -right-4 -top-4 text-7xl opacity-10">🥩</div>
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="text-xl font-black text-emerald-400">El Rey de la Proteína</h3>
                                <span class="bg-emerald-600 text-white text-[10px] font-black px-3 py-1.5 rounded-lg shadow-inner">+4 PUNTOS</span>
                            </div>
                            <p class="text-sm text-slate-300 mb-4 leading-relaxed">Sube al grupo de WhatsApp 1 foto diaria de tus almuerzos demostrando que la mitad de tu plato es proteína o verdura.</p>
                            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                                <p class="text-xs text-slate-400"><strong class="text-emerald-500 font-bold">Validación:</strong> Auditable por todos los miembros durante 5 días seguidos en el chat.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRanking(container) {
            const sortedUsers = [...window.appState.allUsers].sort((a, b) => {
                const countA = a.trainingDays ? a.trainingDays.length : 0;
                const countB = b.trainingDays ? b.trainingDays.length : 0;
                return countB - countA;
            });

            let html = `
                <div class="animate-fade-in pb-6">
                    <h2 class="text-2xl font-black text-white mb-1 text-center mt-2">Ranking General</h2>
                    <p class="text-xs text-slate-400 text-center mb-6">Basado en días de sudor verificados</p>
                    <div class="space-y-3">
            `;

            sortedUsers.forEach((user, index) => {
                let badge = `<div class="w-10 h-10 flex items-center justify-center font-black text-slate-500 text-lg bg-slate-900 rounded-full border border-slate-700 shadow-inner">#${index+1}</div>`;
                if(index === 0) badge = `<div class="w-10 h-10 flex items-center justify-center text-3xl drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]">🥇</div>`;
                if(index === 1) badge = `<div class="w-10 h-10 flex items-center justify-center text-3xl drop-shadow-[0_0_8px_rgba(156,163,175,0.6)]">🥈</div>`;
                if(index === 2) badge = `<div class="w-10 h-10 flex items-center justify-center text-3xl drop-shadow-[0_0_8px_rgba(180,83,9,0.6)]">🥉</div>`;

                const points = user.trainingDays ? user.trainingDays.length : 0;
                
                html += `
                    <div class="glass-panel p-4 rounded-2xl flex items-center justify-between border border-slate-700/50">
                        <div class="flex items-center gap-4">
                            ${badge}
                            <div>
                                <h3 class="font-bold text-white text-lg leading-tight">${user.name}</h3>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Gpo ${user.group.charAt(0)}</p>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-2xl font-black text-blue-400 leading-none">${points}</span>
                            <span class="text-[8px] text-slate-500 font-black uppercase mt-1">PTS</span>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderAdmin(container) {
            let html = `
                <div class="animate-fade-in pb-8">
                    <button onclick="window.switchTab('home')" class="mb-4 flex items-center gap-2 text-sm text-slate-400 font-bold hover:text-white">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
                    </button>
                    <h2 class="text-2xl font-black text-white mb-1 flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-6 h-6 text-amber-400"></i> Panel Supremo
                    </h2>
                    <p class="text-xs text-slate-400 mb-6">Gestión de participantes</p>

                    <div class="space-y-3">
            `;

            window.appState.allUsers.forEach(user => {
                const days = user.trainingDays ? user.trainingDays.length : 0;
                html += `
                    <div class="bg-slate-800/80 p-4 rounded-2xl flex flex-col border border-slate-600 gap-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-white text-base">${user.name}</h3>
                                <p class="text-[10px] text-slate-400 mt-1">PIN: <span class="text-amber-400 font-mono font-bold">${user.pin}</span> | Peso: ${user.startWeight} Kg</p>
                            </div>
                            <span class="text-lg font-black text-slate-500 bg-slate-900 px-3 py-1 rounded-xl">${days} pts</span>
                        </div>
                        <div class="flex gap-2 w-full mt-2 pt-3 border-t border-slate-700/50">
                            <button onclick="window.openEditModal('${user.id}')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-xl text-xs font-bold flex justify-center items-center gap-1 transition-colors">
                                <i data-lucide="edit-2" class="w-4 h-4"></i> Editar
                            </button>
                            <button onclick="window.deleteCompetitor('${user.id}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs font-black flex justify-center items-center gap-1 shadow-lg shadow-red-900/50 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Borrar
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        setTimeout(renderApp, 100);
    </script>
</body>
</html>
