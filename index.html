<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reto: Ya no quiero estar como el chulo</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overscroll-behavior-y: none;

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

            animation: fadeIn 0.4s ease-out forwards;

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

<body class="h-screen w-screen overflow-hidden flex flex-col">

    <script>
        window.firebaseConfig = {
          apiKey: "AIzaSyA5N0yQQfPDfLKCkEbzUPHMMU-IJc6hCdA",
          authDomain: "app-de-ejercicio-a99db.firebaseapp.com",
          projectId: "app-de-ejercicio-a99db",
          storageBucket: "app-de-ejercicio-a99db.firebasestorage.app",
          messagingSenderId: "74777587908",
          appId: "1:74777587908:web:9ec006c45230a7e91c1991",
          measurementId: "G-XKXCW6P675"
        };

        window.START_DATE = new Date("2026-08-18T00:00:00");
        window.END_DATE = new Date("2026-10-30T00:00:00");

        window.appState = {
            currentTab: 'home',
            allUsers: [],
            userData: null,
            meals: []
        };

        window.currentLoginUserId = null;
        window.isAdmin = false;

        window.showToast = function(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-sm font-bold shadow-lg z-[100] animate-fade-in ${type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        };

        window.switchTab = function(tabId, userId = null) {
            window.appState.currentTab = tabId;
            if(userId) {
                window.appState.userData = window.appState.allUsers.find(u => u.id === userId);
            } else if (tabId === 'home') {
                window.appState.userData = null; 
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.add('text-blue-500');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-blue-500');
                    btn.classList.add('text-slate-500');
                }
            });
            
            if(window.renderApp) window.renderApp();

            // Cargar fotos automáticamente si el admin entra al perfil
            if (tabId === 'profile' && window.isAdmin && window.appState.userData) {
                setTimeout(() => {
                    window.loadAdminPhotos(window.appState.userData.id);
                }, 100);
            }
        };

        window.viewUserProfileAsAdmin = function(userId) {
            window.isAdmin = true; // Forzar modo admin
            window.switchTab('profile', userId); // Ir al perfil
        };

        window.promptPin = function(userId) {
            if (window.isAdmin) {
                // Si el admin está activo y toca un usuario en inicio, lo deja pasar directo al perfil.
                window.switchTab('profile', userId);
                return;
            }

            window.currentLoginUserId = userId;
            window.isAdmin = false;
            document.getElementById('pin-title').innerHTML = '<i data-lucide="lock" class="w-6 h-6 text-blue-500"></i> Clave de Acceso';
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
            if(window.lucide) window.lucide.createIcons();
        };

        window.promptAdminPin = function() {
            window.currentLoginUserId = null;
            document.getElementById('pin-title').innerHTML = '<i data-lucide="shield-alert" class="w-6 h-6 text-amber-500"></i> Acceso Admin';
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
            if(window.lucide) window.lucide.createIcons();
        };

        window.closePinModal = function() {
            const modal = document.getElementById('pin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.currentLoginUserId = null;
        };

        window.verifyPin = function() {
            const pin = document.getElementById('login-pin').value;
            // CLAVE ADMIN CONFIGURADA: 010402
            if(pin === '010402') { 
                window.closePinModal();
                window.isAdmin = true;
                if(window.currentLoginUserId) {
                    window.switchTab('profile', window.currentLoginUserId);
                } else {
                    window.switchTab('admin'); 
                }
                return;
            }
            if(!window.currentLoginUserId && pin !== '010402') {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
                return;
            }

            const user = window.appState.allUsers.find(u => u.id === window.currentLoginUserId);
            if(user && user.pin === pin) {
                window.closePinModal();
                window.isAdmin = false;
                window.switchTab('profile', user.id);
            } else {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
            }
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, getDoc, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

        const app = initializeApp(window.firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        
        window.db = db; 
        window.storage = storage;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                listenToParticipants();
                listenToMeals();
            } else {
                signInAnonymously(auth).catch(error => {
                    window.showToast("Error de conexión con Firebase.", "error");
                });
            }
        });

        function listenToParticipants() {
            onSnapshot(collection(db, 'competitors'), (snapshot) => {
                const users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(!data.deleted) users.push({ id: doc.id, ...data });
                });
                window.appState.allUsers = users;
                
                if(window.appState.userData) {
                    window.appState.userData = users.find(u => u.id === window.appState.userData.id);
                }
                if(window.renderApp) window.renderApp();
            });
        }

        function listenToMeals() {
            onSnapshot(collection(db, 'comidas'), (snapshot) => {
                const meals = [];
                snapshot.forEach(doc => {
                    meals.push({ id: doc.id, ...doc.data() });
                });
                window.appState.meals = meals.sort((a,b) => b.timestamp - a.timestamp);
                if(window.renderApp) window.renderApp();
            });
        }

        window.processRegistration = async function() {
            const name = document.getElementById('reg-name').value;
            const weight = parseFloat(document.getElementById('reg-weight').value);
            const height = parseFloat(document.getElementById('reg-height').value);
            const pin = document.getElementById('reg-pin').value;

            if(!name || !weight || !height || !pin) return window.showToast("Completa todos los campos", "error");
            if(pin.length !== 4) return window.showToast("El PIN debe ser de 4 dígitos", "error");

            const heightInMeters = height > 3 ? height / 100 : height;
            const imc = (weight / (heightInMeters * heightInMeters)).toFixed(1);
            const group = imc >= 25 ? 'A (Quemar)' : 'B (Volumen)';

            const newUserId = "user_" + Date.now();
            const newUserData = {
                id: newUserId,
                name: name,
                startWeight: weight,
                height: height,
                imc: parseFloat(imc),
                group: group,
                pin: pin.toString(),
                trainingDays: [],
                deleted: false,
                createdAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, 'competitors', newUserId), newUserData);
                window.showToast(`¡${name} inscrito correctamente!`);
                window.switchTab('home');
            } catch (error) {
                window.showToast("Error guardando datos.", "error");
            }
        };

        window.triggerFileUpload = function(type, userId) {
            const input = document.createElement('input');
            input.type = 'file';
            
            // Lógica: Sudor obliga cámara en vivo. Realidad/Ropa permite subir videos de la galería.
            if(type === 'sudor') {
                input.accept = 'image/*';
                input.capture = 'environment'; // OBLIGA CÁMARA
            } else if (type === 'comida') {
                input.accept = 'image/*'; // Permite galería
            } else {
                input.accept = 'video/*, image/*'; // Permite videos o fotos de la galería
            }

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if(!file) return;

                window.showToast("Subiendo archivo... No cierres la app ⏳", "success");

                try {
                    const now = new Date();
                    const dateStr = now.toLocaleDateString('es-PE') + ' ' + now.toLocaleTimeString('es-PE', {hour: '2-digit', minute:'2-digit'});
                    
                    const fileExt = file.name.split('.').pop() || (type === 'sudor' ? 'jpg' : 'mp4');
                    const fileName = `${type}_${Date.now()}.${fileExt}`;
                    const storageRef = ref(window.storage, `archivos_olimpo/${userId}/${fileName}`);
                    
                    await uploadBytes(storageRef, file);
                    const fileUrl = await getDownloadURL(storageRef);
                    const tipoArch = file.type.startsWith('video') ? 'video' : 'image';
                    
                    if(type === 'sudor') {
                        const todayStr = now.toISOString().split('T')[0];
                        const userRef = doc(window.db, 'competitors', userId);
                        
                        const user = window.appState.allUsers.find(u => u.id === userId);
                        const newDays = user.trainingDays ? [...user.trainingDays, todayStr] : [todayStr];
                        await updateDoc(userRef, { trainingDays: newDays });
                        
                        await setDoc(doc(window.db, `competitors/${userId}/fotos_sudor`, todayStr), {
                            url: fileUrl,
                            fecha: dateStr,
                            tipoArch: tipoArch
                        });
                        window.showToast("¡Sudor registrado! +1 Punto 🔥");
                        
                    } else if (type === 'real' || type === 'ropa') {
                        const photoRef = doc(window.db, `competitors/${userId}/fotos_control`, type);
                        await setDoc(photoRef, {
                            url: fileUrl,
                            fecha: dateStr, 
                            tipo: type,
                            tipoArch: tipoArch
                        });
                        
                        const userRef = doc(window.db, 'competitors', userId);
                        await updateDoc(userRef, { [`fotosControl.${type}`]: dateStr });
                        window.showToast(`¡Archivo de ${type} guardado! 📸`);
                        
                    } else if (type === 'comida') {
                        const mealId = "meal_" + Date.now();
                        const userName = window.appState.allUsers.find(u => u.id === userId).name;
                        await setDoc(doc(window.db, 'comidas', mealId), {
                            userId: userId,
                            userName: userName,
                            url: fileUrl,
                            fecha: dateStr, 
                            timestamp: Date.now(),
                            votosSanos: [],
                            votosTrampa: []
                        });
                        window.showToast("¡Comida subida al muro! 🥗");
                    }
                } catch (error) {
                    console.error(error);
                    window.showToast("Error subiendo el archivo. Asegúrate de tener espacio o Storage activado.", "error");
                }
            };
            input.click();
        };

        window.votarComida = async function(mealId, type) {
            if(!window.appState.userData) return window.showToast("Ingresa a tu perfil primero para votar.", "error");
            const myUserId = window.appState.userData.id;
            
            try {
                const mealRef = doc(window.db, 'comidas', mealId);
                const field = type === 'sano' ? 'votosSanos' : 'votosTrampa';
                await updateDoc(mealRef, {
                    [field]: arrayUnion(myUserId)
                });
                window.showToast("¡Voto registrado!");
            } catch(e) {
                window.showToast("Error al votar.", "error");
            }
        };

        window.deleteCompetitor = async function(userId) {
            if(confirm("¿Seguro que deseas ELIMINAR a este competidor?")) {
                try {
                    await updateDoc(doc(window.db, 'competitors', userId), { deleted: true });
                    window.showToast("Competidor borrado.", "success");
                    window.switchTab('admin');
                } catch(e) {
                    window.showToast("Error al eliminar.", "error");
                }
            }
        };

        window.openEditModal = function(userId) {
            const user = window.appState.allUsers.find(u => u.id === userId);
            if(!user) return;
            window.editingUserId = userId;
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-pin').value = user.pin;
            document.getElementById('edit-weight').value = user.startWeight;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditModal = function() {
            window.editingUserId = null;
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
        };

        window.saveEditModal = async function() {
            if(!window.editingUserId) return;
            try {
                await updateDoc(doc(window.db, 'competitors', window.editingUserId), {
                    name: document.getElementById('edit-name').value,
                    pin: document.getElementById('edit-pin').value,
                    startWeight: parseFloat(document.getElementById('edit-weight').value)
                });
                window.showToast("Datos actualizados.");
                window.closeEditModal();
                window.switchTab('admin');
            } catch (error) {
                window.showToast("Error actualizando.", "error");
            }
        };

        window.loadAdminPhotos = async function(userId) {
            const container = document.getElementById('admin-photos-container');
            if(!container) return;
            try {
                let html = '<div class="space-y-4">';
                
                const controlSnap = await getDocs(collection(window.db, `competitors/${userId}/fotos_control`));
                html += `<div><strong class="text-amber-400 text-xs uppercase mb-1 block">Pruebas de Control (Archivos Reales):</strong><div class="flex gap-2 overflow-x-auto mt-2 pb-2">`;
                if(controlSnap.empty) html += `<span class="text-xs text-slate-500">Sin archivos de control subidos.</span>`;
                controlSnap.forEach(doc => {
                    const data = doc.data();
                    html += `<div class="shrink-0 w-32 border border-slate-700 rounded p-1 bg-slate-900 shadow-md">
                      ${data.tipoArch === 'video' ? `<video src="${data.url}" controls class="w-full h-24 object-cover rounded mb-1"></video>` : `<img src="${data.url}" onclick="window.open('${data.url}')" class="w-full h-24 object-cover rounded mb-1 cursor-pointer">`}
                      <div class="text-[10px] text-amber-300 text-center font-bold uppercase">${doc.id}</div>
                      <div class="text-[9px] text-slate-400 text-center">${data.fecha}</div>
                    </div>`;
                });
                html += `</div></div>`;

                const sudorSnap = await getDocs(collection(window.db, `competitors/${userId}/fotos_sudor`));
                html += `<div><strong class="text-blue-400 text-xs uppercase mb-1 block">Fotos de Sudor Diario:</strong><div class="flex gap-2 overflow-x-auto mt-2 pb-2">`;
                if(sudorSnap.empty) html += `<span class="text-xs text-slate-500">Sin fotos de sudor registradas.</span>`;
                sudorSnap.forEach(doc => {
                    const data = doc.data();
                    html += `<div class="shrink-0 w-32 border border-slate-700 rounded p-1 bg-slate-900 shadow-md">
                      ${data.tipoArch === 'video' ? `<video src="${data.url}" controls class="w-full h-24 object-cover rounded mb-1"></video>` : `<img src="${data.url}" onclick="window.open('${data.url}')" class="w-full h-24 object-cover rounded mb-1 cursor-pointer">`}
                      <div class="text-[10px] text-blue-300 text-center font-bold">${doc.id}</div>
                      <div class="text-[9px] text-slate-400 text-center">${data.fecha}</div>
                    </div>`;
                });
                html += `</div></div>`;

                html += '</div>';
                container.innerHTML = html;
            } catch(e) {
                console.error(e);
                container.innerHTML = '<span class="text-red-400 text-sm">Error cargando evidencias de Firebase.</span>';
            }
        };

        window.renderApp = function() {
            const container = document.getElementById('app-content');
            let html = '';

            const today = new Date();
            const totalDays = Math.ceil((window.END_DATE - window.START_DATE) / (1000 * 60 * 60 * 24));
            const daysPassed = Math.max(0, Math.ceil((today - window.START_DATE) / (1000 * 60 * 60 * 24)));
            const daysRemaining = Math.max(0, totalDays - daysPassed);

            if (window.appState.currentTab === 'home') {
                html += `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h1 class="text-2xl font-black text-blue-500 uppercase tracking-tighter">RETO OLIMPO</h1>
                            <p class="text-xs text-slate-400 font-bold">Ya no quiero estar como el chulo</p>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-xs text-slate-400 uppercase font-bold tracking-widest">Restantes</span>
                            <span class="text-2xl font-black text-white">${daysRemaining} Días</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <h2 class="text-xl font-bold">Competidores</h2>
                            <p class="text-xs text-slate-400">Toca tu nombre para entrar</p>
                        </div>
                        <button onclick="window.switchTab('add-user')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow-lg shadow-blue-900/50 transition-colors">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Añadir
                        </button>
                    </div>
                    <div class="space-y-3 pb-24">
                `;
                
                if(window.appState.allUsers.length === 0) {
                    html += `<div class="text-center p-8 bg-slate-800/50 rounded-2xl border border-slate-700/50 text-slate-400"><p>No hay competidores aún.</p></div>`;
                }

                window.appState.allUsers.forEach(user => {
                    const daysTrained = user.trainingDays ? user.trainingDays.length : 0;
                    
                    let validMealsCount = 0;
                    window.appState.meals.forEach(meal => {
                        if(meal.userId === user.id && meal.votosSanos && meal.votosSanos.length > (meal.votosTrampa ? meal.votosTrampa.length : 0)) {
                            validMealsCount++;
                        }
                    });
                    const proteinaBonus = (validMealsCount >= 5) ? 5 : 0;
                    const totalScore = daysTrained + proteinaBonus;

                    html += `
                        <div onclick="window.promptPin('${user.id}')" class="glass-panel p-4 rounded-2xl border border-slate-700 hover:border-blue-500 cursor-pointer transition-all active:scale-95 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-xl font-black shadow-lg">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg group-hover:text-blue-400 transition-colors">${user.name}</h3>
                                    <div class="flex gap-2 mt-1">
                                        <span class="text-[10px] px-2 py-0.5 bg-blue-900/50 text-blue-300 border border-blue-500/30 rounded-md font-bold">Gpo ${user.group.charAt(0)}</span>
                                        <span class="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-300 border border-slate-600 rounded-md">IMC ${user.imc}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400">${totalScore}</div>
                                <div class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">PTS</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            else if (window.appState.currentTab === 'profile' && window.appState.userData) {
                const user = window.appState.userData;
                const daysTrained = user.trainingDays ? user.trainingDays.length : 0;
                
                let validMealsCount = 0;
                window.appState.meals.forEach(meal => {
                    if(meal.userId === user.id && meal.votosSanos && meal.votosSanos.length > (meal.votosTrampa ? meal.votosTrampa.length : 0)) {
                        validMealsCount++;
                    }
                });
                const proteinaBonus = (validMealsCount >= 5) ? 5 : 0;
                const totalScore = daysTrained + proteinaBonus;

                const todayStr = today.toISOString().split('T')[0];
                const trainedToday = user.trainingDays && user.trainingDays.includes(todayStr);

                // Botón de volver inteligente (Al panel admin o a home)
                const backTab = window.isAdmin ? 'admin' : 'home';

                html += `
                    <div class="mb-6 pb-24">
                        <button onclick="window.switchTab('${backTab}')" class="text-slate-400 mb-4 flex items-center gap-1 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i> Volver</button>
                        
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-3xl font-black shadow-lg shadow-blue-900/50">
                                ${user.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h2 class="text-2xl font-black">${user.name}</h2>
                                <p class="text-sm text-blue-400 font-bold">${user.group}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-center">
                                <span class="block text-xs text-slate-400 mb-1">Puntaje Total</span>
                                <span class="text-3xl font-black text-white">${totalScore}</span>
                            </div>
                            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-center">
                                <span class="block text-xs text-slate-400 mb-1">Días Sudados</span>
                                <span class="text-3xl font-black text-blue-400">${daysTrained}</span>
                            </div>
                            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-center">
                                <span class="block text-xs text-slate-400 mb-1">Bono Proteína</span>
                                <span class="text-xl font-bold text-amber-400">+${proteinaBonus} pts</span>
                            </div>
                            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-center">
                                <span class="block text-xs text-slate-400 mb-1">Peso Inicial</span>
                                <span class="text-xl font-bold text-slate-300">${user.startWeight} kg</span>
                            </div>
                        </div>

                        <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700 relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 opacity-5"><i data-lucide="flame" class="w-32 h-32"></i></div>
                            <h3 class="font-bold mb-2 flex items-center gap-2"><i data-lucide="dumbbell" class="text-blue-500"></i> Tu Sudor de Hoy</h3>
                            <p class="text-xs text-slate-400 mb-4">Obligatorio usar cámara en vivo (Anti-Trampa).</p>
                            <button onclick="window.triggerFileUpload('sudor', '${user.id}')" class="w-full py-4 rounded-xl font-black text-lg flex items-center justify-center gap-2 transition-all ${trainedToday ? 'bg-emerald-600 text-white cursor-default' : 'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/50'}">
                                ${trainedToday ? '<i data-lucide="check-circle" class="w-6 h-6"></i> ¡Sudor Registrado Hoy!' : '<i data-lucide="camera" class="w-6 h-6"></i> Grabar Sudor (+1 Pt)'}
                            </button>
                        </div>

                        <div class="mb-6">
                            <h3 class="font-bold mb-3 text-sm uppercase tracking-wider text-slate-400 flex items-center gap-2"><i data-lucide="calendar"></i> Historial de Sudor</h3>
                            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                                <div class="grid grid-cols-7 gap-1 text-center text-xs mb-2 text-slate-500 font-bold">
                                    <div>D</div><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div>
                                </div>
                                <div class="grid grid-cols-7 gap-1">
                `;
                
                const startDay = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
                const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                
                for(let i=0; i<startDay; i++) { html += `<div class="aspect-square"></div>`; }
                for(let i=1; i<=daysInMonth; i++) {
                    const dateObj = new Date(today.getFullYear(), today.getMonth(), i);
                    const dateStrFormat = dateObj.toISOString().split('T')[0];
                    const hasTrained = user.trainingDays && user.trainingDays.includes(dateStrFormat);
                    const isToday = i === today.getDate();
                    
                    html += `<div class="aspect-square flex items-center justify-center rounded-md ${hasTrained ? 'bg-blue-600/20 text-blue-400 font-bold border border-blue-500/30' : isToday ? 'bg-slate-700 text-white border border-slate-500' : 'text-slate-500'}">
                        ${hasTrained ? '<i data-lucide="dumbbell" class="w-3 h-3"></i>' : i}
                    </div>`;
                }
                
                html += `
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="font-bold mb-3 text-sm uppercase tracking-wider text-slate-400 flex items-center gap-2"><i data-lucide="video"></i> Pruebas de Control</h3>
                            <div class="space-y-3">
                                <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-rose-400">Video "Realidad"</div>
                                        <div class="text-[10px] text-slate-400">Sin polo, giro 360°<br>${user.fotosControl?.real ? `Subido: ${user.fotosControl.real}` : 'Pendiente'}</div>
                                    </div>
                                    <button onclick="window.triggerFileUpload('real', '${user.id}')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 text-rose-400 border border-slate-600 shadow-md">
                                        <i data-lucide="upload" class="w-4 h-4"></i> ${user.fotosControl?.real ? 'Cambiar' : 'Subir'}
                                    </button>
                                </div>
                                <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-amber-400">Video "Ropa Control"</div>
                                        <div class="text-[10px] text-slate-400">Prenda mal ajustada<br>${user.fotosControl?.ropa ? `Subido: ${user.fotosControl.ropa}` : 'Pendiente'}</div>
                                    </div>
                                    <button onclick="window.triggerFileUpload('ropa', '${user.id}')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 text-amber-400 border border-slate-600 shadow-md">
                                        <i data-lucide="upload" class="w-4 h-4"></i> ${user.fotosControl?.ropa ? 'Cambiar' : 'Subir'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        ${window.isAdmin ? `
                            <div class="mt-8 border-t border-slate-700 pt-6">
                                <h3 class="text-amber-500 font-bold mb-4 flex items-center gap-2"><i data-lucide="eye"></i> Vista Admin (Ojo de Dios)</h3>
                                <div class="bg-slate-800 border border-amber-500/30 p-4 rounded-xl shadow-[0_0_15px_rgba(245,158,11,0.1)]">
                                    <p class="text-xs text-slate-400 mb-2">Has ingresado con la clave maestra. Aquí cargan las evidencias reales del usuario.</p>
                                    <div id="admin-photos-container">
                                        <div class="text-center text-sm text-slate-400 py-4"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> Cargando evidencias reales...</div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            else if (window.appState.currentTab === 'retos') {
                html += `
                    <div class="mb-6 pb-24">
                        <h2 class="text-2xl font-black text-amber-400 uppercase mb-2"><i data-lucide="swords" class="inline-block mr-2"></i> Retos Semanales</h2>
                        <p class="text-sm text-slate-400 mb-6">Cumple los retos para sumar puntos extra al ranking.</p>

                        <div class="bg-slate-800 rounded-2xl p-5 border border-amber-500/30 mb-6 relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 opacity-10 text-amber-500"><i data-lucide="beef" class="w-32 h-32"></i></div>
                            <h3 class="text-xl font-bold text-amber-400 mb-2">El Rey de la Proteína</h3>
                            <p class="text-xs text-slate-300 mb-4 leading-relaxed">
                                <strong>Regla:</strong> Sube foto de tu almuerzo (buena proteína). Los demás votarán. Si consigues <strong>5 comidas sanas en la semana</strong>, ganas +5 puntos directos.
                            </p>
                            ${window.appState.userData ? `
                                <button onclick="window.triggerFileUpload('comida', '${window.appState.userData.id}')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg">
                                    <i data-lucide="upload"></i> Subir Mi Almuerzo de Hoy
                                </button>
                            ` : `<p class="text-xs text-red-400 italic font-bold text-center bg-red-900/20 p-2 rounded">Ingresa a tu perfil en Inicio para subir tu comida.</p>`}
                        </div>

                        <h3 class="font-bold text-lg mb-4 text-white flex items-center gap-2"><i data-lucide="layout-grid" class="w-5 h-5 text-blue-400"></i> Muro de Comidas</h3>
                        <div class="space-y-4">
                `;

                if(window.appState.meals.length === 0) {
                    html += `<p class="text-center text-slate-500 text-sm py-8 border border-dashed border-slate-700 rounded-xl">Nadie ha subido su comida aún. ¡Sé el primero!</p>`;
                }

                window.appState.meals.forEach(meal => {
                    const sanos = meal.votosSanos ? meal.votosSanos.length : 0;
                    const trampa = meal.votosTrampa ? meal.votosTrampa.length : 0;
                    const isSano = sanos > trampa;
                    
                    html += `
                        <div class="bg-slate-900 border ${isSano ? 'border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.1)]' : 'border-slate-700'} rounded-xl overflow-hidden shadow-lg">
                            <div class="p-3 flex justify-between items-center border-b border-slate-800">
                                <span class="font-bold text-blue-400 text-sm"><i data-lucide="user" class="w-4 h-4 inline pb-1"></i> ${meal.userName}</span>
                                <span class="text-[10px] text-slate-500">${meal.fecha}</span>
                            </div>
                            <div class="relative">
                                <img src="${meal.url}" class="w-full h-48 object-cover" alt="Comida">
                                ${isSano && sanos > 0 ? '<div class="absolute top-2 right-2 bg-emerald-500 text-white px-2 py-1 rounded text-xs font-bold shadow flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Validada</div>' : ''}
                            </div>
                            <div class="p-3 flex gap-2">
                                <button onclick="window.votarComida('${meal.id}', 'sano')" class="flex-1 bg-emerald-900/30 border border-emerald-500/50 hover:bg-emerald-800/50 text-emerald-400 font-bold py-2 rounded-lg text-sm flex items-center justify-center gap-2 transition">
                                    <i data-lucide="thumbs-up" class="w-4 h-4"></i> Sano (${sanos})
                                </button>
                                <button onclick="window.votarComida('${meal.id}', 'trampa')" class="flex-1 bg-red-900/30 border border-red-500/50 hover:bg-red-800/50 text-red-400 font-bold py-2 rounded-lg text-sm flex items-center justify-center gap-2 transition">
                                    <i data-lucide="thumbs-down" class="w-4 h-4"></i> Trampa (${trampa})
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            else if (window.appState.currentTab === 'bases') {
                html += `
                    <div class="mb-6 pb-24 text-sm text-slate-300 leading-relaxed">
                        <h2 class="text-2xl font-black text-white uppercase mb-6 border-b border-slate-700 pb-4">Bases del Reto</h2>
                        <div class="space-y-6">
                            <section>
                                <h3 class="text-blue-400 font-bold text-lg mb-2 flex items-center gap-2"><i data-lucide="calendar" class="w-5 h-5"></i> Duración</h3>
                                <p><strong>18 de Agosto al 29 de Octubre</strong> (Día 30: Reunión y Votación Final).</p>
                            </section>
                            <section>
                                <h3 class="text-emerald-400 font-bold text-lg mb-2 flex items-center gap-2"><i data-lucide="dumbbell" class="w-5 h-5"></i> 1. El Sudor Diario</h3>
                                <ul class="list-disc pl-5 space-y-1">
                                    <li><strong>1 punto</strong> por día entrenado.</li>
                                    <li>Mecánica: Grabar video/foto desde la app (Cámara en vivo obligatoria).</li>
                                </ul>
                            </section>
                            <section>
                                <h3 class="text-amber-400 font-bold text-lg mb-2 flex items-center gap-2"><i data-lucide="scale" class="w-5 h-5"></i> 2. Categorías y Peso Justo</h3>
                                <p class="mb-2">Basado en el IMC (Índice de Masa Corporal):</p>
                                <ul class="list-disc pl-5 space-y-2 mb-2">
                                    <li><strong>Grupo A (Quema de grasa):</strong> IMC de sobrepeso.</li>
                                    <li><strong>Grupo B (Volumen Limpio):</strong> IMC bajo o normal.</li>
                                </ul>
                            </section>
                            <section>
                                <h3 class="text-purple-400 font-bold text-lg mb-2 flex items-center gap-2"><i data-lucide="camera" class="w-5 h-5"></i> 3. Métrica Visual</h3>
                                <ul class="list-disc pl-5 space-y-1 text-xs">
                                    <li><strong>Video Realidad:</strong> Sin polo, giro 360 (Se sube de galería).</li>
                                    <li><strong>Video Ropa Control:</strong> Prenda ajustada al inicio y final (Se sube de galería).</li>
                                </ul>
                            </section>
                        </div>
                    </div>
                `;
            }

            else if (window.appState.currentTab === 'add-user') {
                html += `
                    <div class="mb-6">
                        <button onclick="window.switchTab('home')" class="text-slate-400 mb-6 flex items-center gap-1 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i> Cancelar</button>
                        <h2 class="text-2xl font-black mb-6">Nuevo Competidor</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase block mb-2">Nombre del Guerrero</label>
                                <input type="text" id="reg-name" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Ej. Espartano 1">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs font-bold text-slate-400 uppercase block mb-2">Peso Inicial (kg)</label>
                                    <input type="number" step="0.1" id="reg-weight" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Ej. 85.5">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-slate-400 uppercase block mb-2">Altura (m o cm)</label>
                                    <input type="number" step="0.01" id="reg-height" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Ej. 1.75">
                                </div>
                            </div>
                            <div class="pt-2">
                                <label class="text-xs font-bold text-amber-400 uppercase block mb-2"><i data-lucide="lock" class="w-3 h-3 inline"></i> PIN de Seguridad (4 dígitos)</label>
                                <input type="number" id="reg-pin" class="w-full bg-slate-800 border border-amber-500/50 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none text-center tracking-widest text-lg font-bold" placeholder="****">
                                <p class="text-[10px] text-slate-500 mt-1">Crea una clave que no olvides.</p>
                            </div>
                            <button onclick="window.processRegistration()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl mt-6 shadow-lg shadow-blue-900/50 transition-colors">
                                Inscribir en el Olimpo
                            </button>
                        </div>
                    </div>
                `;
            }

            else if (window.appState.currentTab === 'admin') {
                html += `
                    <div class="mb-6 pb-24">
                        <button onclick="window.switchTab('home')" class="text-slate-400 mb-4 flex items-center gap-1 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a Inicio</button>
                        <h2 class="text-2xl font-black text-amber-500 mb-6 flex items-center gap-2"><i data-lucide="shield-alert"></i> Panel Admin</h2>
                        <div class="space-y-3">
                `;
                
                window.appState.allUsers.forEach(user => {
                    html += `
                        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center shadow-lg">
                            <div>
                                <h3 class="font-bold text-white">${user.name}</h3>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">PIN: <span class="text-amber-400">${user.pin}</span> | Peso: ${user.startWeight}kg</p>
                            </div>
                            <div class="flex gap-2">
                                <!-- NUEVO BOTÓN PARA AUDITAR PERFIL -->
                                <button onclick="window.viewUserProfileAsAdmin('${user.id}')" class="bg-blue-900/50 border border-blue-500/30 hover:bg-blue-800 text-blue-400 p-2 rounded-lg transition" title="Ver Evidencias">
                                    <i data-lucide="eye" class="w-4 h-4"></i>
                                </button>
                                <button onclick="window.openEditModal('${user.id}')" class="bg-slate-700 border border-slate-600 hover:bg-slate-600 text-white p-2 rounded-lg transition" title="Editar Info">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                                <button onclick="window.deleteCompetitor('${user.id}')" class="bg-red-900/50 border border-red-500/30 hover:bg-red-800 text-red-400 p-2 rounded-lg transition" title="Eliminar Usuario">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }

            container.innerHTML = html;
            if(window.lucide) window.lucide.createIcons();
        };

        window.onload = function() {
            window.renderApp();
        };
    </script>

    <div class="flex-1 overflow-y-auto p-6" id="app-content"></div>

    <div class="bg-slate-900 border-t border-slate-800 px-6 py-4 flex justify-between items-center z-50 fixed bottom-0 w-full pb-8">
        <button onclick="window.switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center gap-1 text-blue-500 transition-colors">
            <i data-lucide="home" class="w-6 h-6"></i><span class="text-[10px] font-bold">Inicio</span>
        </button>
        <button onclick="window.switchTab('retos')" data-tab="retos" class="nav-btn flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="swords" class="w-6 h-6"></i><span class="text-[10px] font-bold">Retos</span>
        </button>
        <button onclick="window.switchTab('bases')" data-tab="bases" class="nav-btn flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="book-open" class="w-6 h-6"></i><span class="text-[10px] font-bold">Bases</span>
        </button>
        <button onclick="window.promptAdminPin()" class="flex flex-col items-center gap-1 text-slate-600 hover:text-amber-500 transition-colors">
            <i data-lucide="settings" class="w-6 h-6"></i><span class="text-[10px] font-bold">Admin</span>
        </button>
    </div>

    <!-- Modales para PIN y Edición -->
    <div id="pin-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm relative shadow-2xl">
            <button onclick="window.closePinModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 id="pin-title" class="text-xl font-bold text-white mb-4 flex items-center gap-2"></h3>
            <input type="number" id="login-pin" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white text-2xl font-black tracking-[0.5em] text-center focus:border-blue-500 focus:outline-none mb-4" placeholder="****">
            <button onclick="window.verifyPin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-colors">Ingresar</button>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm relative shadow-2xl space-y-4">
            <button onclick="window.closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-bold text-white mb-2">Editar Competidor</h3>
            <div><label class="text-xs text-slate-400 block mb-1">Nombre</label><input type="text" id="edit-name" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white"></div>
            <div><label class="text-xs text-slate-400 block mb-1">Peso Inicial (kg)</label><input type="number" step="0.1" id="edit-weight" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white"></div>
            <div><label class="text-xs text-slate-400 block mb-1">PIN</label><input type="number" id="edit-pin" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white"></div>
            <button onclick="window.saveEditModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl mt-2">Guardar Cambios</button>
        </div>
    </div>

</body>
</html>
