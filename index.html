<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reto: Ya no quiero estar como el chulo</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overscroll-behavior-y: none;
        }

            backdrop-filter: blur(12px);

        }

            animation: fadeIn 0.4s ease-out forwards;

        }

<body class="h-screen w-screen overflow-hidden flex flex-col">

    <script>
        // Tu llave de Firebase
        window.firebaseConfig = {
          apiKey: "AIzaSyA5N0yQQfPDfLKCkEbzUPHMMU-IJc6hCdA",
          authDomain: "app-de-ejercicio-a99db.firebaseapp.com",
          projectId: "app-de-ejercicio-a99db",
          storageBucket: "app-de-ejercicio-a99db.firebasestorage.app",
          messagingSenderId: "74777587908",
          appId: "1:74777587908:web:9ec006c45230a7e91c1991",
          measurementId: "G-XKXCW6P675"
        };

        window.START_DATE = new Date("2026-08-18T00:00:00");
        window.END_DATE = new Date("2026-10-30T00:00:00");

        window.appState = {
            currentTab: 'home',
            allUsers: [],
            userData: null,
            meals: []
        };

        window.showToast = function(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-sm font-bold shadow-lg z-[100] animate-fade-in ${type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        };

        window.switchTab = function(tabId, userId = null) {
            window.appState.currentTab = tabId;
            if(userId) {
                window.appState.userData = window.appState.allUsers.find(u => u.id === userId);
            } else if (tabId === 'home') {
                window.appState.userData = null; 
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.add('text-blue-500');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-blue-500');
                    btn.classList.add('text-slate-500');
                }
            });
            if(window.renderApp) window.renderApp();
        };

        window.currentLoginUserId = null;
        window.isAdmin = false;
        
        window.promptPin = function(userId) {
            window.currentLoginUserId = userId;
            window.isAdmin = false;
            document.getElementById('pin-title').innerHTML = '<i data-lucide="lock" class="w-6 h-6 text-blue-500"></i> Clave de Acceso';
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
            if(window.lucide) window.lucide.createIcons();
        };

        window.closePinModal = function() {
            const modal = document.getElementById('pin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.currentLoginUserId = null;
        };

        window.verifyPin = function() {
            const pin = document.getElementById('login-pin').value;
            // EL NUEVO PIN DE ADMINISTRADOR SECRETO
            if(pin === '010402') { 
                window.closePinModal();
                if(window.currentLoginUserId) {
                    window.isAdmin = true; // Entra al perfil como admin (Ojo de Dios)
                    window.switchTab('profile', window.currentLoginUserId);
                } else {
                    window.switchTab('admin'); // Entra al panel general
                }
                return;
            }
            if(!window.currentLoginUserId && pin !== '010402') {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
                return;
            }

            const user = window.appState.allUsers.find(u => u.id === window.currentLoginUserId);
            if(user && user.pin === pin) {
                window.closePinModal();
                window.isAdmin = false;
                window.switchTab('profile', user.id);
            } else {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
            }
        };

        window.promptAdminPin = function() {
            window.currentLoginUserId = null;
            document.getElementById('pin-title').innerHTML = '<i data-lucide="shield-alert" class="w-6 h-6 text-amber-500"></i> Acceso Admin';
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
            if(window.lucide) window.lucide.createIcons();
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, getDoc, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

        const app = initializeApp(window.firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        
        window.db = db; 
        window.storage = storage;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                listenToParticipants();
                listenToMeals();
            } else {
                signInAnonymously(auth).catch(error => {
                    window.showToast("Debes habilitar Auth Anónimo en Firebase.", "error");
                });
            }
        });

        function listenToParticipants() {
            onSnapshot(collection(db, 'competitors'), (snapshot) => {
                const users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(!data.deleted) users.push({ id: doc.id, ...data });
                });
                window.appState.allUsers = users;
                
                if(window.appState.userData) {
                    window.appState.userData = users.find(u => u.id === window.appState.userData.id);
                }
                if(window.renderApp) window.renderApp();
            });
        }

        function listenToMeals() {
            onSnapshot(collection(db, 'comidas'), (snapshot) => {
                const meals = [];
                snapshot.forEach(doc => {
                    meals.push({ id: doc.id, ...doc.data() });
                });
                // Ordenar por más recientes
                window.appState.meals = meals.sort((a,b) => b.timestamp - a.timestamp);
                if(window.renderApp) window.renderApp();
            });
        }

        window.processRegistration = async function() {
            const name = document.getElementById('reg-name').value;
            const weight = parseFloat(document.getElementById('reg-weight').value);
            const height = parseFloat(document.getElementById('reg-height').value);
            const pin = document.getElementById('reg-pin').value;

            if(!name || !weight || !height || !pin) return window.showToast("Completa todos los campos", "error");
            if(pin.length !== 4) return window.showToast("El PIN debe ser de 4 dígitos", "error");

            const heightInMeters = height > 3 ? height / 100 : height;
            const imc = (weight / (heightInMeters * heightInMeters)).toFixed(1);
            const group = imc >= 25 ? 'A (Quemar)' : 'B (Volumen)';

            const newUserId = "user_" + Date.now();
            const newUserData = {
                id: newUserId,
                name: name,
                startWeight: weight,
                height: height,
                imc: parseFloat(imc),
                group: group,
                pin: pin.toString(),
                trainingDays: [],
                deleted: false,
                createdAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, 'competitors', newUserId), newUserData);
                window.showToast(`¡${name} inscrito correctamente!`);
                window.switchTab('home');
            } catch (error) {
                window.showToast("Error guardando datos.", "error");
            }
        };

        window.triggerFileUpload = function(type, userId) {
            const input = document.createElement('input');
            input.type = 'file';
            
            // Lógica de cámara y galería
            if(type === 'sudor' || type === 'comida') {
                input.accept = 'image/*';
                if(type === 'sudor') input.capture = 'environment'; // Obliga usar cámara
            } else {
                input.accept = 'video/*, image/*'; // Permite galería para Realidad y Ropa
            }

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if(!file) return;

                window.showToast("Subiendo archivo... No cierres la app ⏳", "success");

                try {
                    const now = new Date();
                    const dateStr = now.toLocaleDateString('es-PE') + ' ' + now.toLocaleTimeString('es-PE', {hour: '2-digit', minute:'2-digit'});
                    
                    // Nombres únicos para Storage
                    const fileExt = file.name.split('.').pop() || (type === 'sudor' ? 'jpg' : 'mp4');
                    const fileName = `${type}_${Date.now()}.${fileExt}`;
                    const storageRef = ref(window.storage, `archivos_olimpo/${userId}/${fileName}`);
                    
                    // Subir archivo real
                    await uploadBytes(storageRef, file);
                    const fileUrl = await getDownloadURL(storageRef);
                    const tipoArch = file.type.startsWith('video') ? 'video' : 'image';
                    
                    if(type === 'sudor') {
                        const todayStr = now.toISOString().split('T')[0];
                        const userRef = doc(window.db, 'competitors', userId);
                        
                        const user = window.appState.allUsers.find(u => u.id === userId);
                        const newDays = user.trainingDays ? [...user.trainingDays, todayStr] : [todayStr];
                        await updateDoc(userRef, { trainingDays: newDays });
                        
                        await setDoc(doc(window.db, `competitors/${userId}/fotos_sudor`, todayStr), {
                            url: fileUrl,
                            fecha: dateStr,
                            tipoArch: tipoArch
                        });
                        window.showToast("¡Sudor registrado! +1 Punto 🔥");
                        
                    } else if (type === 'real' || type === 'ropa') {
                        const photoRef = doc(window.db, `competitors/${userId}/fotos_control`, type);
                        await setDoc(photoRef, {
                            url: fileUrl,
                            fecha: dateStr,
                            tipo: type,
                            tipoArch: tipoArch
                        });
                        
                        const userRef = doc(window.db, 'competitors', userId);
                        await updateDoc(userRef, { [`fotosControl.${type}`]: dateStr });
                        window.showToast(`¡Archivo de ${type} guardado! 📸`);
                        
                    } else if (type === 'comida') {
                        const mealId = "meal_" + Date.now();
                        const userName = window.appState.allUsers.find(u => u.id === userId).name;
                        await setDoc(doc(window.db, 'comidas', mealId), {
                            userId: userId,
                            userName: userName,
                            url: fileUrl,
                            fecha: dateStr,
                            timestamp: Date.now(),
                            votosSanos: [],
                            votosTrampa: []
                        });
                        window.showToast("¡Comida subida al muro! 🥗");
                    }
                } catch (error) {
                    console.error(error);
                    window.showToast("Error subiendo archivo. Revisa el plan de Firebase.", "error");
                }
            };
            input.click();
        };

        window.votarComida = async function(mealId, type) {
            if(!window.appState.userData) return window.showToast("Ingresa a tu perfil primero.", "error");
            const myUserId = window.appState.userData.id;
            
            try {
                const mealRef = doc(window.db, 'comidas', mealId);
                const field = type === 'sano' ? 'votosSanos' : 'votosTrampa';
                await updateDoc(mealRef, {
                    [field]: arrayUnion(myUserId)
                });
                window.showToast("¡Voto registrado!");
            } catch(e) {
                window.showToast("Error al votar.", "error");
            }
        };

        window.deleteCompetitor = async function(userId) {
            if(confirm("¿Seguro que deseas ELIMINAR a este competidor del Olimpo?")) {
                try {
                    await updateDoc(doc(window.db, 'competitors', userId), { deleted: true });
                    window.showToast("Competidor borrado.", "success");
                } catch(e) {
                    window.showToast("Error al eliminar.", "error");
                }
            }
        };

        window.openEditModal = function(userId) {
            const user = window.appState.allUsers.find(u => u.id === userId);
            if(!user) return;
            window.editingUserId = userId;
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-pin').value = user.pin;
            document.getElementById('edit-weight').value = user.startWeight;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditModal = function() {
            window.editingUserId = null;
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
        };

        window.saveEditModal = async function() {
            if(!window.editingUserId) return;
            try {
                await updateDoc(doc(window.db, 'competitors', window.editingUserId), {
                    name: document.getElementById('edit-name').value,
                    pin: document.getElementById('edit-pin').value,
                    startWeight: parseFloat(document.getElementById('edit-weight').value)
                });
                window.showToast("Datos actualizados.");
                window.closeEditModal();
            } catch (error) {
                window.showToast("Error actualizando datos.", "error");
            }
        };

        window.loadAdminPhotos = async function(userId) {
            const container = document.getElementById('admin-photos-container');
            if(!container) return;
            try {
                let html = '<div class="space-y-4">';
                
                // Cargar Control
                const controlSnap = await getDocs(collection(window.db, `competitors/${userId}/fotos_control`));
                html += `<div><strong class="text-white text-xs">Pruebas de Control (Originales):</strong><div class="flex gap-2 overflow-x-auto mt-2">`;
                if(controlSnap.empty) html += `<span class="text-xs text-slate-500">Sin archivos</span>`;
                controlSnap.forEach(doc => {
                    const data = doc.data();
                    html += `<div class="shrink-0 w-32 border border-slate-700 rounded p-1 bg-slate-900">
                      ${data.tipoArch === 'video' ? `<video src="${data.url}" controls class="w-full h-24 object-cover rounded mb-1"></video>` : `<img src="${data.url}" class="w-full h-24 object-cover rounded mb-1">`}
                      <div class="text-[10px] text-slate-300 text-center font-bold">${doc.id.toUpperCase()}</div>
                      <div class="text-[9px] text-slate-500 text-center">${data.fecha}</div>
                    </div>`;
                });
                html += `</div></div>`;

                // Cargar Sudor
                const sudorSnap = await getDocs(collection(window.db, `competitors/${userId}/fotos_sudor`));
                html += `<div><strong class="text-white text-xs">Fotos de Sudor:</strong><div class="flex gap-2 overflow-x-auto mt-2">`;
                if(sudorSnap.empty) html += `<span class="text-xs text-slate-500">Sin archivos</span>`;
                sudorSnap.forEach(doc => {
                    const data = doc.data();
                    html += `<div class="shrink-0 w-32 border border-slate-700 rounded p-1 bg-slate-900">
                      <img src="${data.url}" class="w-full h-24 object-cover rounded mb-1">
                      <div class="text-[10px] text-slate-300 text-center">${doc.id}</div>
                      <div class="text-[9px] text-slate-500 text-center">${data.fecha}</div>
                    </div>`;
                });
                html += `</div></div>`;

                html += '</div>';
                container.innerHTML = html;
            } catch(e) {
                console.error(e);
                container.innerHTML = '<span class="text-red-400">Error cargando base de datos.</span>';
            }
        };

        window.renderApp = function() {
            const container = document.getElementById('app-content');
            let html = '';

            const today = new Date();
            const totalDays = Math.ceil((window.END_DATE - window.START_DATE) / (1000 * 60 * 60 * 24));
            const daysPassed = Math.max(0, Math.ceil((today - window.START_DATE) / (1000 * 60 * 60 * 24)));
            const daysRemaining = Math.max(0, totalDays - daysPassed);

            if (window.appState.currentTab === 'home') {
                html += `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h1 class="text-2xl font-black text-blue-500 uppercase tracking-tighter">RETO OLIMPO</h1>
                            <p class="text-xs text-slate-400 font-bold">Ya no quiero estar como el chulo</p>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-xs text-slate-400 uppercase font-bold tracking-widest">Restantes</span>
                            <span class="text-2xl font-black text-white">${daysRemaining} Días</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <h2 class="text-xl font-bold">Competidores</h2>
                            <p class="text-xs text-slate-400">Toca tu nombre para entrar y sudar</p>
                        </div>
                        <button onclick="window.switchTab('add-user')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow-lg shadow-blue-900/50 transition-colors">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Añadir
                        </button>
                    </div>
                    <div class="space-y-3 pb-24">
                `;
                
                if(window.appState.allUsers.length === 0) {
                    html += `<div class="text-center p-8 bg-slate-800/50 rounded-2xl border border-slate-700/50 text-slate-400"><p>No hay competidores aún.</p><p class="text-xs mt-2">¡Añade al primero para empezar!</p></div>`;
                }

                window.appState.allUsers.forEach(user => {
                    const daysTrained = user.trainingDays ? user.trainingDays.length : 0;
                    html += `
                        <div onclick="window.promptPin('${user.id}')" class="glass-panel p-4 rounded-2xl border border-slate-700 hover:border-blue-500 cursor-pointer transition-all active:scale-95 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-xl font-black shadow-lg">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg group-hover:text-blue-400 transition-colors">${user.name}</h3>
                                    <div class="flex gap-2 mt-1">
                                        <span class="text-[10px] px-2 py-0.5 bg-blue-900/50 text-blue-300 border border-blue-500/30 rounded-md font-bold">Gpo ${user.group.charAt(0)}</span>
                                        <span class="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-300 border border-slate-600 rounded-md">IMC ${user.imc}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400">${daysTrained}</div>
                                <div class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">PTS</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            else if (window.appState.currentTab === 'add-user') {
                html += `
                    <div class="mb-6 flex items-center gap-3">
                        <button onclick="window.switchTab('home')" class="p-2 bg-slate-800 rounded-full text-slate-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                        <h2 class="text-xl font-bold">Nuevo Competidor</h2>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl border border-slate-700 space-y-4">
                        <div><label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Nombre (Apodo)</label><input type="text" id="reg-name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Ej. El Chulo"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Peso (kg)</label><input type="number" step="0.1" id="reg-weight" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none" placeholder="85.5"></div>
                            <div><label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Estatura (cm)</label><input type="number" id="reg-height" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none" placeholder="175"></div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-amber-500 uppercase tracking-wider block mb-1 flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> PIN Secreto (4 dígitos)</label>
                            <input type="number" id="reg-pin" class="w-full bg-slate-900 border border-amber-500/50 rounded-xl px-4 py-3 text-amber-500 font-black tracking-[0.5em] text-center focus:border-amber-500 focus:outline-none" placeholder="****">
                            <p class="text-[10px] text-slate-500 text-center mt-1">Guarda este PIN, lo necesitarás para entrar a tu perfil.</p>
                        </div>
                        <button onclick="window.processRegistration()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl mt-4 shadow-lg shadow-blue-900/50 transition-colors">Inscribir al Olimpo</button>
                    </div>
                `;
            }

            else if (window.appState.currentTab === 'profile' && window.appState.userData) {
                const u = window.appState.userData;
                const todayStr = new Date().toISOString().split('T')[0];
                const trainedToday = u.trainingDays && u.trainingDays.includes(todayStr);
                const daysTrained = u.trainingDays ? u.trainingDays.length : 0;
                
                // Calcular comidas válidas de la semana actual
                const now = new Date();
                const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1; 
                const mondayThisWeek = new Date(now);
                mondayThisWeek.setDate(now.getDate() - dayOfWeek);
                mondayThisWeek.setHours(0,0,0,0);
                
                let validMealsThisWeek = 0;
                window.appState.meals.forEach(m => {
                    if(m.userId === u.id && m.timestamp >= mondayThisWeek.getTime()) {
                        if(m.votosSanos && m.votosTrampa && m.votosSanos.length > m.votosTrampa.length) {
                            validMealsThisWeek++;
                        }
                    }
                });

                const mealPoints = validMealsThisWeek >= 5 ? 5 : 0;
                const totalScore = daysTrained + mealPoints;

                html += `
                    <div class="mb-6 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button onclick="window.switchTab('home')" class="p-2 bg-slate-800 rounded-full text-slate-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                            <div>
                                <h2 class="text-xl font-bold flex items-center gap-2">${u.name} ${window.isAdmin ? '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-500 text-[10px] rounded border border-amber-500/50">VISTA ADMIN</span>' : ''}</h2>
                                <p class="text-xs text-slate-400">Grupo ${u.group} | Inició con ${u.startWeight}kg</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-black text-blue-400">${totalScore}</div>
                            <div class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">PUNTOS</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-center">
                            <i data-lucide="dumbbell" class="w-5 h-5 mx-auto text-emerald-400 mb-1"></i>
                            <div class="text-sm font-bold text-emerald-400">${daysTrained} Días</div>
                            <div class="text-[10px] text-slate-400 uppercase">Sudor (+${daysTrained} pts)</div>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-center">
                            <i data-lucide="beef" class="w-5 h-5 mx-auto text-amber-400 mb-1"></i>
                            <div class="text-sm font-bold text-amber-400">${validMealsThisWeek}/5 Comidas</div>
                            <div class="text-[10px] text-slate-400 uppercase">Rey Proteína (+${mealPoints} pts)</div>
                        </div>
                    </div>

                    ${!trainedToday ? `
                        <button onclick="window.triggerFileUpload('sudor', '${u.id}')" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-black py-5 rounded-2xl mb-6 shadow-[0_0_20px_rgba(225,29,72,0.4)] transition-all active:scale-95 flex flex-col items-center justify-center border border-red-400/30">
                            <i data-lucide="camera" class="w-8 h-8 mb-1"></i>
                            <span class="text-lg uppercase tracking-wider">Cámara Anti-Trampas</span>
                            <span class="text-xs font-normal text-red-200 mt-1">Sube foto EN VIVO para ganar 1 punto hoy</span>
                        </button>
                    ` : `
                        <div class="w-full bg-emerald-900/30 border border-emerald-500/50 text-emerald-400 font-bold py-4 rounded-2xl mb-6 flex flex-col items-center justify-center">
                            <i data-lucide="check-circle-2" class="w-8 h-8 mb-1"></i>
                            <span class="text-lg">¡Entrenamiento Validado!</span>
                            <span class="text-xs font-normal text-emerald-500/70">Punto sumado. Regresa mañana.</span>
                        </div>
                    `}

                    <div class="glass-panel rounded-2xl border border-slate-700 overflow-hidden mb-6">
                        <div class="bg-slate-800/50 px-4 py-3 border-b border-slate-700 flex items-center gap-2">
                            <i data-lucide="video" class="w-4 h-4 text-slate-400"></i>
                            <h3 class="font-bold text-sm">Pruebas de Control (Fotos/Videos)</h3>
                        </div>
                        <div class="p-4 space-y-4">
                            <div class="flex items-center justify-between p-3 bg-slate-900 rounded-xl border border-slate-800">
                                <div>
                                    <div class="text-sm font-bold">1. "Realidad"</div>
                                    <div class="text-[10px] text-slate-500">Sin polo (Giro 360°)</div>
                                    ${u.fotosControl && u.fotosControl.real ? `<div class="text-[10px] text-emerald-400 mt-1 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Subido: ${u.fotosControl.real}</div>` : ''}
                                </div>
                                <button onclick="window.triggerFileUpload('real', '${u.id}')" class="px-4 py-2 bg-slate-800 text-blue-400 text-xs font-bold rounded-lg border border-blue-500/30 flex items-center gap-2">
                                    <i data-lucide="upload" class="w-4 h-4"></i> Galería
                                </button>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-slate-900 rounded-xl border border-slate-800">
                                <div>
                                    <div class="text-sm font-bold">2. "Ropa Control"</div>
                                    <div class="text-[10px] text-slate-500">Prenda mal ajustada</div>
                                    ${u.fotosControl && u.fotosControl.ropa ? `<div class="text-[10px] text-emerald-400 mt-1 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Subido: ${u.fotosControl.ropa}</div>` : ''}
                                </div>
                                <button onclick="window.triggerFileUpload('ropa', '${u.id}')" class="px-4 py-2 bg-slate-800 text-orange-400 text-xs font-bold rounded-lg border border-orange-500/30 flex items-center gap-2">
                                    <i data-lucide="upload" class="w-4 h-4"></i> Galería
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                if(window.isAdmin) {
                    html += `
                        <div class="mt-8 bg-slate-800 p-4 rounded-xl border border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.2)] pb-24">
                            <h3 class="text-amber-400 font-bold mb-4 flex items-center gap-2">
                                <i data-lucide="eye" class="w-5 h-5"></i> Panel Inspector (Ojo de Dios)
                            </h3>
                            <div id="admin-photos-container" class="text-sm text-slate-400">
                                <i data-lucide="loader" class="w-4 h-4 animate-spin inline mr-2"></i> Obteniendo archivos reales de la base de datos...
                            </div>
                        </div>
                    `;
                    setTimeout(() => window.loadAdminPhotos(u.id), 100);
                }
            }

            else if (window.appState.currentTab === 'retos') {
                html += `
                    <div class="mb-6">
                        <h2 class="text-2xl font-black text-white uppercase flex items-center gap-2"><i data-lucide="swords" class="text-amber-500"></i> Retos Activos</h2>
                    </div>

                    <div class="glass-panel p-5 rounded-2xl border border-amber-500/30 mb-6 bg-gradient-to-br from-slate-900 to-slate-800 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10"><i data-lucide="beef" class="w-24 h-24 text-amber-500"></i></div>
                        <h3 class="text-xl font-black text-amber-400 mb-2 relative z-10">El Rey de la Proteína 👑</h3>
                        <p class="text-xs text-slate-300 relative z-10 mb-4 leading-relaxed">Sube 1 foto diaria de tu almuerzo. La comunidad votará. Si consigues <b>5 comidas validadas</b> de Lunes a Domingo, ganas <b class="text-emerald-400">+5 Puntos</b> directos.</p>
                        ${window.appState.userData ? 
                            `<button onclick="window.triggerFileUpload('comida', '${window.appState.userData.id}')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-colors relative z-10">
                                <i data-lucide="camera" class="w-5 h-5"></i> Subir Comida de Hoy (Cámara)
                            </button>` : 
                            `<div class="text-xs text-amber-500/70 border border-amber-500/30 p-2 rounded text-center">Inicia sesión en tu perfil para subir tu comida.</div>`
                        }
                    </div>

                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="layout-grid" class="text-blue-400"></i> Muro de Comidas (Esta Semana)</h3>
                    <div class="space-y-4 pb-24">
                `;

                const now = new Date();
                const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1; 
                const mondayThisWeek = new Date(now);
                mondayThisWeek.setDate(now.getDate() - dayOfWeek);
                mondayThisWeek.setHours(0,0,0,0);

                const mealsThisWeek = window.appState.meals.filter(m => m.timestamp >= mondayThisWeek.getTime());

                if(mealsThisWeek.length === 0) {
                    html += `<div class="text-center p-8 bg-slate-800/50 rounded-2xl border border-slate-700 text-slate-400 text-xs">Nadie ha subido su comida esta semana. ¡Sé el primero!</div>`;
                }

                mealsThisWeek.forEach(m => {
                    const validada = m.votosSanos && m.votosTrampa && m.votosSanos.length > m.votosTrampa.length;
                    const reprobada = m.votosSanos && m.votosTrampa && m.votosSanos.length < m.votosTrampa.length;
                    let statusBadge = `<span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-[10px]">Pendiente</span>`;
                    if(validada) statusBadge = `<span class="bg-emerald-900 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30 text-[10px]">✅ Validada</span>`;
                    if(reprobada) statusBadge = `<span class="bg-red-900 text-red-400 px-2 py-0.5 rounded border border-red-500/30 text-[10px]">❌ Trampa</span>`;

                    html += `
                        <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                            <div class="p-3 flex justify-between items-center bg-slate-900">
                                <div class="font-bold text-sm">${m.userName}</div>
                                <div class="flex items-center gap-2">${statusBadge} <span class="text-[9px] text-slate-500">${m.fecha}</span></div>
                            </div>
                            <img src="${m.url}" class="w-full h-48 object-cover" loading="lazy">
                            <div class="p-3 flex gap-2">
                                <button onclick="window.votarComida('${m.id}', 'sano')" class="flex-1 py-2 bg-emerald-900/30 hover:bg-emerald-900/50 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-bold flex items-center justify-center gap-1">
                                    <i data-lucide="thumbs-up" class="w-4 h-4"></i> Sano (${m.votosSanos ? m.votosSanos.length : 0})
                                </button>
                                <button onclick="window.votarComida('${m.id}', 'trampa')" class="flex-1 py-2 bg-red-900/30 hover:bg-red-900/50 text-red-400 border border-red-500/30 rounded-lg text-xs font-bold flex items-center justify-center gap-1">
                                    <i data-lucide="thumbs-down" class="w-4 h-4"></i> Trampa (${m.votosTrampa ? m.votosTrampa.length : 0})
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            else if (window.appState.currentTab === 'bases') {
                html += `
                    <div class="mb-6"><h2 class="text-2xl font-black text-white uppercase flex items-center gap-2"><i data-lucide="book-open" class="text-blue-500"></i> Bases Oficiales</h2></div>
                    <div class="space-y-4 pb-24 text-sm text-slate-300 leading-relaxed">
                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="text-white font-bold mb-2 flex items-center gap-2 text-lg"><i data-lucide="calendar" class="text-blue-400"></i> Duración</h3>
                            <p>18 de Agosto al 29 de Octubre (73 Días).<br>Reunión Final: 30 de Octubre.</p>
                        </div>
                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="text-white font-bold mb-2 flex items-center gap-2 text-lg"><i data-lucide="camera" class="text-emerald-400"></i> 1. El Sudor Diario</h3>
                            <p>1 punto por cada día validado con foto de esfuerzo <b>en vivo</b>. Prohibido usar galería.</p>
                            <p class="mt-2 text-red-400 text-xs">Penalidad: El Auditor anula el día y resta -2 puntos si detecta foto falsa.</p>
                        </div>
                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="text-white font-bold mb-2 flex items-center gap-2 text-lg"><i data-lucide="scale" class="text-purple-400"></i> 2. Sistema de Peso Justo</h3>
                            <p><b>Grupo A (Quemar) - PCP:</b></p>
                            <ul class="list-disc pl-5 mb-2 text-xs space-y-1"><li>3% a 5% = 10 pts</li><li>5.1% a 8% = 15 pts</li><li>> 8% = 20 pts</li></ul>
                            <p><b>Grupo B (Volumen) - PCP:</b></p>
                            <ul class="list-disc pl-5 text-xs space-y-1"><li>2% a 4% = 15 pts</li><li>> 4% = 10 pts (Se penaliza exceso de grasa)</li></ul>
                        </div>
                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="text-white font-bold mb-2 flex items-center gap-2 text-lg"><i data-lucide="users" class="text-amber-400"></i> 3. La Votación Final</h3>
                            <p>El 30 de Octubre se proyectan los videos de Control Inicial vs Final. Todos votan del 1 al 5 el cambio estético (Voto secreto, no a sí mismo).</p>
                        </div>
                    </div>
                `;
            }

            else if (window.appState.currentTab === 'admin') {
                html += `
                    <div class="mb-6 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button onclick="window.switchTab('home')" class="p-2 bg-slate-800 rounded-full text-slate-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                            <h2 class="text-xl font-bold text-amber-500 flex items-center gap-2"><i data-lucide="shield"></i> Admin Panel</h2>
                        </div>
                    </div>
                    <div class="space-y-3 pb-24">
                `;
                window.appState.allUsers.forEach(user => {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div>
                                <div class="font-bold text-white">${user.name}</div>
                                <div class="text-[10px] text-slate-400">PIN: ${user.pin} | Peso: ${user.startWeight}kg</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.openEditModal('${user.id}')" class="p-2 bg-blue-900/30 text-blue-400 rounded hover:bg-blue-900/50"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                <button onclick="window.deleteCompetitor('${user.id}')" class="p-2 bg-red-900/30 text-red-400 rounded hover:bg-red-900/50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            document.getElementById('app-content').innerHTML = html;
            if(window.lucide) window.lucide.createIcons();
        };

        window.onload = function() {
            window.renderApp();
        };
    </script>

    <div class="flex-1 overflow-y-auto p-6" id="app-content"></div>

    <div class="bg-slate-900 border-t border-slate-800 px-6 py-4 flex justify-between items-center z-50 relative">
        <button onclick="window.switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center gap-1 text-blue-500 transition-colors">
            <i data-lucide="home" class="w-6 h-6"></i><span class="text-[10px] font-bold">Inicio</span>
        </button>
        <button onclick="window.switchTab('retos')" data-tab="retos" class="nav-btn flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="swords" class="w-6 h-6"></i><span class="text-[10px] font-bold">Retos</span>
        </button>
        <button onclick="window.switchTab('bases')" data-tab="bases" class="nav-btn flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="book-open" class="w-6 h-6"></i><span class="text-[10px] font-bold">Bases</span>
        </button>
        <button onclick="window.promptAdminPin()" class="flex flex-col items-center gap-1 text-slate-600 hover:text-amber-500 transition-colors">
            <i data-lucide="settings" class="w-6 h-6"></i><span class="text-[10px] font-bold">Admin</span>
        </button>
    </div>

    <!-- Modales -->
    <div id="pin-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm relative shadow-2xl">
            <button onclick="window.closePinModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 id="pin-title" class="text-xl font-bold text-white mb-4 flex items-center gap-2"></h3>
            <input type="number" id="login-pin" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white text-2xl font-black tracking-[0.5em] text-center focus:border-blue-500 focus:outline-none mb-4" placeholder="****">
            <button onclick="window.verifyPin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-colors">Ingresar</button>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm relative shadow-2xl space-y-4">
            <button onclick="window.closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-bold text-white mb-2">Editar Competidor</h3>
            <div><label class="text-xs text-slate-400 block mb-1">Nombre</label><input type="text" id="edit-name" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white"></div>
            <div><label class="text-xs text-slate-400 block mb-1">Peso Inicial (kg)</label><input type="number" step="0.1" id="edit-weight" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white"></div>
            <div><label class="text-xs text-slate-400 block mb-1">PIN</label><input type="number" id="edit-pin" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white"></div>
            <button onclick="window.saveEditModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl mt-2">Guardar Cambios</button>
        </div>
    </div>

</body>
</html>
