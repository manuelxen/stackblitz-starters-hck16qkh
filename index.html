<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reto Olimpo: Ya no quiero estar como el chulo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overscroll-behavior-y: none;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .podium-1 { border: 2px solid #fbbf24; background: linear-gradient(145deg, rgba(251, 191, 36, 0.1) 0%, rgba(30, 41, 59, 1) 100%); }
        .podium-2 { border: 2px solid #94a3b8; background: linear-gradient(145deg, rgba(148, 163, 184, 0.1) 0%, rgba(30, 41, 59, 1) 100%); }
        .podium-3 { border: 2px solid #b45309; background: linear-gradient(145deg, rgba(180, 83, 9, 0.1) 0%, rgba(30, 41, 59, 1) 100%); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <script>
        // CONFIGURACIÓN DE FIREBASE (Base de datos de texto)
        window.firebaseConfig = {
          apiKey: "AIzaSyA5N0yQQfPDfLKCkEbzUPHMMU-IJc6hCdA",
          authDomain: "app-de-ejercicio-a99db.firebaseapp.com",
          projectId: "app-de-ejercicio-a99db",
          storageBucket: "app-de-ejercicio-a99db.firebasestorage.app",
          messagingSenderId: "74777587908",
          appId: "1:74777587908:web:9ec006c45230a7e91c1991",
          measurementId: "G-XKXCW6P675"
        };

        // --- CREDENCIALES CLOUDINARY CONFIGURADAS ---
        window.CLOUDINARY_CLOUD_NAME = 'jeraruhb'; 
        window.CLOUDINARY_UPLOAD_PRESET = 'olimpo_preset'; 
        // ---------------------------------------------

        window.START_DATE = new Date("2026-08-18T00:00:00");
        window.END_DATE = new Date("2026-10-30T00:00:00");

        window.appState = {
            currentTab: 'home',
            allUsers: [],
            userData: null,
            meals: []
        };

        window.currentLoginUserId = null;
        window.isAdmin = false;

        window.showToast = function(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-4 py-3 rounded-xl text-sm font-bold shadow-2xl z-[100] animate-fade-in flex items-center gap-2 ${type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i> ${msg}`;
            document.body.appendChild(toast);
            if(window.lucide) window.lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        };

        window.switchTab = function(tabId, userId = null) {
            window.appState.currentTab = tabId;
            if(userId) {
                window.appState.userData = window.appState.allUsers.find(u => u.id === userId);
            } else if (tabId === 'home') {
                window.appState.userData = null; 
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.add('text-blue-500');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-blue-500');
                    btn.classList.add('text-slate-500');
                }
            });
            
            if(window.renderApp) window.renderApp();

            if (tabId === 'profile' && window.isAdmin && window.appState.userData) {
                setTimeout(() => {
                    window.loadAdminPhotos(window.appState.userData.id);
                }, 100);
            }
        };

        window.viewUserProfileAsAdmin = function(userId) {
            window.isAdmin = true;
            window.switchTab('profile', userId);
        };

        window.promptPin = function(userId) {
            if (window.isAdmin) {
                window.switchTab('profile', userId);
                return;
            }
            window.currentLoginUserId = userId;
            window.isAdmin = false;
            document.getElementById('pin-title').innerHTML = '<i data-lucide="lock" class="w-6 h-6 text-blue-500"></i> PIN del Guerrero';
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
            if(window.lucide) window.lucide.createIcons();
        };

        window.promptAdminPin = function() {
            window.currentLoginUserId = null;
            document.getElementById('pin-title').innerHTML = '<i data-lucide="shield-alert" class="w-6 h-6 text-amber-500"></i> Acceso Admin';
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
            if(window.lucide) window.lucide.createIcons();
        };

        window.closePinModal = function() {
            const modal = document.getElementById('pin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.currentLoginUserId = null;
        };

        window.verifyPin = function() {
            const pin = document.getElementById('login-pin').value;
            // CLAVE ADMIN SECRETA
            if(pin === '010402') { 
                window.closePinModal();
                window.isAdmin = true;
                if(window.currentLoginUserId) {
                    window.switchTab('profile', window.currentLoginUserId);
                } else {
                    window.switchTab('admin'); 
                }
                return;
            }
            if(!window.currentLoginUserId && pin !== '010402') {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
                return;
            }

            const user = window.appState.allUsers.find(u => u.id === window.currentLoginUserId);
            if(user && user.pin === pin) {
                window.closePinModal();
                window.isAdmin = false;
                window.switchTab('profile', user.id);
            } else {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
            }
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const app = initializeApp(window.firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db; 

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                listenToParticipants();
                listenToMeals();
            } else {
                signInAnonymously(auth).catch(error => {
                    window.showToast("Error de conexión con la Base de Datos.", "error");
                });
            }
        });

        function listenToParticipants() {
            onSnapshot(collection(db, 'competitors'), (snapshot) => {
                const users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(!data.deleted) users.push({ id: doc.id, ...data });
                });
                window.appState.allUsers = users;
                
                if(window.appState.userData) {
                    window.appState.userData = users.find(u => u.id === window.appState.userData.id);
                }
                if(window.renderApp) window.renderApp();
            });
        }

        function listenToMeals() {
            onSnapshot(collection(db, 'comidas'), (snapshot) => {
                const meals = [];
                snapshot.forEach(doc => {
                    meals.push({ id: doc.id, ...doc.data() });
                });
                window.appState.meals = meals.sort((a,b) => b.timestamp - a.timestamp);
                if(window.renderApp) window.renderApp();
            });
        }

        window.processRegistration = async function() {
            const name = document.getElementById('reg-name').value;
            const weight = parseFloat(document.getElementById('reg-weight').value);
            const height = parseFloat(document.getElementById('reg-height').value);
            const pin = document.getElementById('reg-pin').value;

            if(!name || !weight || !height || !pin) return window.showToast("Completa todos los campos", "error");
            if(pin.length !== 4) return window.showToast("El PIN debe ser de 4 dígitos", "error");

            const heightInMeters = height > 3 ? height / 100 : height;
            const imc = (weight / (heightInMeters * heightInMeters)).toFixed(1);
            const group = imc >= 25 ? 'A (Quemar)' : 'B (Volumen)';

            const newUserId = "user_" + Date.now();
            const newUserData = {
                id: newUserId,
                name: name,
                startWeight: weight,
                height: height,
                imc: parseFloat(imc),
                group: group,
                pin: pin.toString(),
                trainingDays: [],
                deleted: false,
                createdAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, 'competitors', newUserId), newUserData);
                window.showToast(`¡${name} inscrito correctamente!`);
                window.switchTab('home');
            } catch (error) {
                window.showToast("Error guardando datos.", "error");
            }
        };

        window.triggerFileUpload = function(type, userId) {
            const input = document.createElement('input');
            input.type = 'file';
            
            if(type === 'sudor') {
                input.accept = 'image/*';
                input.capture = 'environment';
            } else if (type === 'comida') {
                input.accept = 'image/*';
            } else {
                input.accept = 'video/*, image/*';
            }

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if(!file) return;

                window.showToast("Subiendo archivo a la nube... ⏳", "success");

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', window.CLOUDINARY_UPLOAD_PRESET);

                    const uploadUrl = `https://api.cloudinary.com/v1_1/${window.CLOUDINARY_CLOUD_NAME}/auto/upload`;

                    const response = await fetch(uploadUrl, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error("Error en Cloudinary");
                    const data = await response.json();
                    
                    let fileUrl = data.secure_url; 
                    const tipoArch = file.type.startsWith('video') ? 'video' : 'image';
                    
                    // --- FIX DE MAGIA CLOUDINARY PARA IPHONE Y FORMATOS RAROS ---
                    // Obligamos a Cloudinary a convertir CUALQUIER imagen a JPG web-safe (f_auto)
                    if (fileUrl.includes('/upload/') && !fileUrl.includes('f_auto')) {
                        fileUrl = fileUrl.replace('/upload/', '/upload/f_auto,q_auto/');
                    }
                    if (tipoArch === 'image') {
                        fileUrl = fileUrl.replace(/\.heic$/i, '.jpg').replace(/\.heif$/i, '.jpg');
                    }
                    // -------------------------------------------

                    const now = new Date();
                    // Formato exacto con día, mes, hora y minuto
                    const optionsDate = { day: '2-digit', month: '2-digit', year: 'numeric' };
                    const optionsTime = { hour: '2-digit', minute: '2-digit', hour12: true };
                    const dateStr = now.toLocaleDateString('es-PE', optionsDate) + ' a las ' + now.toLocaleTimeString('es-PE', optionsTime);

                    if(type === 'sudor') {
                        const todayStr = now.toISOString().split('T')[0];
                        
                        // 1. REGLA DE ORO: PRIMERO GUARDAMOS LA FOTO
                        // Si este paso falla, el sistema saltará al 'catch' y NUNCA dará el punto.
                        await setDoc(doc(window.db, `competitors/${userId}/fotos_sudor`, todayStr), {
                            url: fileUrl,
                            fecha: dateStr,
                            tipoArch: tipoArch
                        });

                        // 2. FOTO CONFIRMADA: AHORA SÍ DAMOS EL PUNTO (Actualizamos trainingDays)
                        const userRef = doc(window.db, 'competitors', userId);
                        const user = window.appState.allUsers.find(u => u.id === userId);
                        const trainingDaysSet = new Set(user.trainingDays || []);
                        trainingDaysSet.add(todayStr);
                        const newDays = Array.from(trainingDaysSet);
                        
                        await updateDoc(userRef, { trainingDays: newDays });
                        
                        window.showToast("¡Sudor de hoy registrado correctamente! 🔥");
                        
                    } else if (type === 'real' || type === 'ropa') {
                        // Se guarda con ID fijo 'real' o 'ropa'
                        const photoRef = doc(window.db, `competitors/${userId}/fotos_control`, type);
                        await setDoc(photoRef, {
                            url: fileUrl,
                            fecha: dateStr, 
                            tipo: type,
                            tipoArch: tipoArch
                        });
                        
                        const userRef = doc(window.db, 'competitors', userId);
                        await updateDoc(userRef, { [`fotosControl.${type}`]: dateStr });
                        window.showToast(`¡Archivo de ${type} actualizado con éxito! 📸`);
                        
                    } else if (type === 'comida') {
                        const mealId = "meal_" + Date.now();
                        const userName = window.appState.allUsers.find(u => u.id === userId).name;
                        await setDoc(doc(window.db, 'comidas', mealId), {
                            userId: userId,
                            userName: userName,
                            url: fileUrl,
                            fecha: dateStr, 
                            timestamp: Date.now(),
                            votosSanos: [],
                            votosTrampa: []
                        });
                        window.showToast("¡Comida subida al muro! 🥗");
                    }
                    if(window.isAdmin && userId) {
                        setTimeout(() => window.loadAdminPhotos(userId), 500);
                    }
                } catch (error) {
                    console.error(error);
                    window.showToast("Error. No se guardó la foto. Intenta de nuevo.", "error");
                }
            };
            input.click();
        };

        // Función para eliminar archivos subidos (Control o Sudor)
        window.deleteUserFile = async function(userId, collectionName, docId, fileType) {
            if(!confirm("¿Estás seguro de eliminar este archivo?")) return;
            try {
                await deleteDoc(doc(window.db, `competitors/${userId}/${collectionName}`, docId));
                
                if(collectionName === 'fotos_control') {
                    const userRef = doc(window.db, 'competitors', userId);
                    await updateDoc(userRef, { [`fotosControl.${fileType}`]: null });
                } else if (collectionName === 'fotos_sudor') {
                    const user = window.appState.allUsers.find(u => u.id === userId);
                    if(user && user.trainingDays) {
                        const updatedDays = user.trainingDays.filter(d => d !== docId);
                        await updateDoc(doc(window.db, 'competitors', userId), { trainingDays: updatedDays });
                    }
                }
                window.showToast("Archivo eliminado correctamente.");
                window.loadAdminPhotos(userId);
            } catch(e) {
                window.showToast("Error al eliminar archivo", "error");
            }
        };

        window.votarComida = async function(mealId, type) {
            if(!window.appState.userData) return window.showToast("Ingresa a tu perfil primero para votar.", "error");
            const myUserId = window.appState.userData.id;
            
            try {
                const mealRef = doc(window.db, 'comidas', mealId);
                const field = type === 'sano' ? 'votosSanos' : 'votosTrampa';
                await updateDoc(mealRef, {
                    [field]: arrayUnion(myUserId)
                });
                window.showToast("¡Voto registrado!");
            } catch(e) {
                window.showToast("Error al votar.", "error");
            }
        };

        window.deleteCompetitor = async function(userId) {
            if(confirm("¿Seguro que deseas ELIMINAR a este competidor?")) {
                try {
                    await updateDoc(doc(window.db, 'competitors', userId), { deleted: true });
                    window.showToast("Competidor borrado.", "success");
                    window.switchTab('admin');
                } catch(e) {
                    window.showToast("Error al eliminar.", "error");
                }
            }
        };

        window.openEditModal = function(userId) {
            const user = window.appState.allUsers.find(u => u.id === userId);
            if(!user) return;
            window.editingUserId = userId;
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-pin').value = user.pin;
            document.getElementById('edit-weight').value = user.startWeight;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditModal = function() {
            window.editingUserId = null;
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
        };

        window.saveEditModal = async function() {
            if(!window.editingUserId) return;
            try {
                await updateDoc(doc(window.db, 'competitors', window.editingUserId), {
                    name: document.getElementById('edit-name').value,
                    pin: document.getElementById('edit-pin').value,
                    startWeight: parseFloat(document.getElementById('edit-weight').value)
                });
                window.showToast("Datos actualizados.");
                window.closeEditModal();
                window.switchTab('admin');
            } catch (error) {
                window.showToast("Error actualizando.", "error");
            }
        };

        // Panel Ojo de Dios Automático para Administrador
        window.loadAdminPhotos = async function(userId) {
            const container = document.getElementById('admin-photos-container');
            if(!container) return;
            try {
                let html = '<div class="space-y-6">';
                
                // Cargar Control (Real / Ropa)
                const controlSnap = await getDocs(collection(window.db, `competitors/${userId}/fotos_control`));
                html += `<div><strong class="text-amber-400 text-sm uppercase mb-2 flex items-center gap-2"><i data-lucide="video"></i> Pruebas de Control Reales</strong><div class="grid grid-cols-2 gap-3 mt-2">`;
                if(controlSnap.empty) {
                    html += `<span class="text-xs text-slate-500 bg-slate-900 p-4 rounded-xl col-span-2 text-center border border-slate-700">Sin archivos subidos aún.</span>`;
                } else {
                    controlSnap.forEach(docSnap => {
                        const data = docSnap.data();
                        
                        // FIX HEIC (Aplicando transformación universal para registros antiguos también)
                        let safeUrl = data.url;
                        if (safeUrl && safeUrl.includes('/upload/') && !safeUrl.includes('f_auto')) {
                            safeUrl = safeUrl.replace('/upload/', '/upload/f_auto,q_auto/');
                        }
                        if (data.tipoArch !== 'video' && safeUrl) {
                            safeUrl = safeUrl.replace(/\.heic$/i, '.jpg').replace(/\.heif$/i, '.jpg');
                        }

                        html += `<div class="border border-slate-700 rounded-xl p-2.5 bg-slate-900 shadow-xl relative overflow-hidden group">
                          ${data.tipoArch === 'video' ? `<video src="${safeUrl}" controls playsinline class="w-full aspect-square object-cover rounded-lg mb-2 bg-black"></video>` : `<img src="${safeUrl}" onclick="window.open('${safeUrl}')" class="w-full aspect-square object-cover rounded-lg mb-2 cursor-pointer hover:opacity-80 transition">`}
                          <div class="absolute top-3 right-3 bg-black/80 backdrop-blur px-2 py-1 rounded text-[10px] font-black text-amber-400 uppercase">${docSnap.id}</div>
                          <div class="text-[11px] font-bold text-slate-300 bg-slate-800 p-1.5 rounded mb-2 text-center"><i data-lucide="calendar" class="w-3 h-3 inline text-amber-400"></i> ${data.fecha}</div>
                          <button onclick="window.deleteUserFile('${userId}', 'fotos_control', '${docSnap.id}', '${docSnap.id}')" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs font-black py-1.5 rounded-lg border border-red-500/40 flex items-center justify-center gap-1 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Eliminar</button>
                        </div>`;
                    });
                }
                html += `</div></div>`;

                // Cargar Sudor Diario
                const sudorSnap = await getDocs(collection(window.db, `competitors/${userId}/fotos_sudor`));
                html += `<div><strong class="text-blue-400 text-sm uppercase mb-2 flex items-center gap-2"><i data-lucide="camera"></i> Historial de Sudor Diario</strong><div class="grid grid-cols-2 gap-3 mt-2">`;
                if(sudorSnap.empty) {
                    html += `<div class="text-xs text-slate-500 bg-slate-900 p-4 rounded-xl col-span-2 text-center border border-slate-700">Sin registros de sudor todavía.</div>`;
                } else {
                    sudorSnap.forEach(docSnap => {
                        const data = docSnap.data();
                        
                        // FIX HEIC (Aplicando transformación universal para registros antiguos también)
                        let safeUrl = data.url;
                        if (safeUrl && safeUrl.includes('/upload/') && !safeUrl.includes('f_auto')) {
                            safeUrl = safeUrl.replace('/upload/', '/upload/f_auto,q_auto/');
                        }
                        if (data.tipoArch !== 'video' && safeUrl) {
                            safeUrl = safeUrl.replace(/\.heic$/i, '.jpg').replace(/\.heif$/i, '.jpg');
                        }

                        html += `<div class="border border-slate-700 rounded-xl p-2.5 bg-slate-900 shadow-xl relative overflow-hidden">
                          ${data.tipoArch === 'video' ? `<video src="${safeUrl}" controls playsinline class="w-full aspect-square object-cover rounded-lg mb-2 bg-black"></video>` : `<img src="${safeUrl}" onclick="window.open('${safeUrl}')" class="w-full aspect-square object-cover rounded-lg mb-2 cursor-pointer hover:opacity-80 transition">`}
                          <div class="absolute top-3 right-3 bg-blue-600/90 backdrop-blur px-2 py-1 rounded text-[10px] font-black text-white">Día: ${docSnap.id}</div>
                          <div class="text-[11px] font-bold text-slate-300 bg-slate-800 p-1.5 rounded mb-2 text-center"><i data-lucide="calendar" class="w-3 h-3 inline text-blue-400"></i> ${data.fecha}</div>
                          <button onclick="window.deleteUserFile('${userId}', 'fotos_sudor', '${docSnap.id}', 'sudor')" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs font-black py-1.5 rounded-lg border border-red-500/40 flex items-center justify-center gap-1 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Eliminar</button>
                        </div>`;
                    });
                }
                html += `</div></div>`;

                html += '</div>';
                container.innerHTML = html;
                if(window.lucide) window.lucide.createIcons();
            } catch(e) {
                console.error(e);
                container.innerHTML = '<span class="text-red-400 text-sm">Error cargando evidencias de la base de datos.</span>';
            }
        };

        window.renderApp = function() {
            const container = document.getElementById('app-content');
            let html = '';

            const today = new Date();
            const totalDays = Math.ceil((window.END_DATE - window.START_DATE) / (1000 * 60 * 60 * 24));
            const daysPassed = Math.max(0, Math.ceil((today - window.START_DATE) / (1000 * 60 * 60 * 24)));
            const daysRemaining = Math.max(0, totalDays - daysPassed);

            if (window.appState.currentTab === 'home') {
                html += `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h1 class="text-3xl font-black text-blue-500 uppercase tracking-tighter drop-shadow-md">OLIMPO</h1>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Ya no quiero estar como el chulo</p>
                        </div>
                        <div class="text-right flex flex-col items-end bg-slate-800/50 px-3 py-2 rounded-xl border border-slate-700">
                            <span class="text-[10px] text-amber-500 uppercase font-black tracking-widest flex items-center gap-1"><i data-lucide="timer" class="w-3 h-3"></i> Restantes</span>
                            <span class="text-2xl font-black text-white">${daysRemaining} Días</span>

                html += `
                    <div class="mb-6 pb-24">
                        <button onclick="window.switchTab('home')" class="text-slate-400 mb-6 flex items-center gap-1 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg text-sm font-bold border border-slate-700"><i data-lucide="arrow-left" class="w-4 h-4"></i> Salir</button>
                        <h2 class="text-3xl font-black text-amber-500 mb-2 flex items-center gap-2 drop-shadow"><i data-lucide="shield-alert" class="w-8 h-8"></i> Control</h2>
                        <p class="text-xs text-slate-400 mb-6 font-bold uppercase tracking-widest">Modo Administrador Activado</p>
                        <div class="space-y-4">
                `;
                
                window.appState.allUsers.forEach(user => {
                    html += `
                        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex justify-between items-center shadow-lg relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-amber-500"></div>
                            <div class="pl-2">
                                <h3 class="font-black text-lg text-white">${user.name}</h3>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1 tracking-wider">PIN: <span class="text-amber-400 text-xs">****</span> <span class="mx-1">|</span> Peso: ${user.startWeight}kg</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.viewUserProfileAsAdmin('${user.id}')" class="bg-blue-500/10 border border-blue-500/50 hover:bg-blue-500/20 text-blue-400 p-3 rounded-xl transition shadow" title="Ver Ojo de Dios">
                                    <i data-lucide="eye" class="w-5 h-5"></i>
                                </button>
                                <button onclick="window.openEditModal('${user.id}')" class="bg-slate-700 border border-slate-600 hover:bg-slate-600 text-white p-3 rounded-xl transition shadow" title="Editar">
                                    <i data-lucide="edit-2" class="w-5 h-5"></i>
                                </button>
                                <button onclick="window.deleteCompetitor('${user.id}')" class="bg-red-500/10 border border-red-500/50 hover:bg-red-500/20 text-red-400 p-3 rounded-xl transition shadow" title="Eliminar">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }

            else if (window.appState.currentTab === 'add-user') {
                html += `
                    <div class="mb-6">
                        <button onclick="window.switchTab('home')" class="text-slate-400 mb-6 flex items-center gap-1 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg text-sm font-bold border border-slate-700"><i data-lucide="arrow-left" class="w-4 h-4"></i> Cancelar</button>
                        <h2 class="text-3xl font-black mb-6 text-white">Nuevo Mortal</h2>
                        <div class="space-y-5 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Nombre del Guerrero</label>
                                <input type="text" id="reg-name" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white focus:border-blue-500 focus:outline-none font-bold" placeholder="Ej. Espartano 1">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Peso Inicial (kg)</label>
                                    <input type="number" step="0.1" id="reg-weight" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white focus:border-blue-500 focus:outline-none font-bold" placeholder="Ej. 85.5">
                                </div>
                                <div>
                                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Altura (m)</label>
                                    <input type="number" step="0.01" id="reg-height" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white focus:border-blue-500 focus:outline-none font-bold" placeholder="Ej. 1.75">
                                </div>
                            </div>
                            <div class="pt-2">
                                <label class="text-[10px] font-black text-amber-400 uppercase tracking-widest block mb-2"><i data-lucide="lock" class="w-3 h-3 inline"></i> Clave Secreta (4 dígitos)</label>
                                <input type="password" inputmode="numeric" pattern="[0-9]*" id="reg-pin" class="w-full bg-slate-900 border border-amber-500/50 rounded-xl px-4 py-4 text-amber-400 focus:border-amber-500 focus:outline-none text-center tracking-[0.5em] text-2xl font-black" placeholder="****">
                            </div>
                            <button onclick="window.processRegistration()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-4 rounded-xl mt-4 shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-transform active:scale-95">
                                Inscribir en el Olimpo
                            </button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            if(window.lucide) window.lucide.createIcons();
        };

        window.onload = function() {
            window.renderApp();
        };
    </script>

    <!-- Contenedor Principal -->
    <div class="flex-1 overflow-y-auto p-6" id="app-content"></div>

    <!-- Menú Inferior -->
    <div class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-4 flex justify-between items-center z-50 fixed bottom-0 w-full pb-8 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <button onclick="window.switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center gap-1.5 text-blue-500 transition-colors">
            <i data-lucide="bar-chart-2" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-widest">Ranking</span>
        </button>
        <button onclick="window.switchTab('retos')" data-tab="retos" class="nav-btn flex flex-col items-center gap-1.5 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="swords" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-widest">Retos</span>
        </button>
        <button onclick="window.switchTab('bases')" data-tab="bases" class="nav-btn flex flex-col items-center gap-1.5 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="book-open" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-widest">Bases</span>
        </button>
        <button onclick="window.promptAdminPin()" class="flex flex-col items-center gap-1.5 text-slate-600 hover:text-amber-500 transition-colors">
            <i data-lucide="settings" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-widest">Admin</span>
        </button>
    </div>

    <!-- Modales -->
    <div id="pin-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl w-full max-w-sm relative shadow-2xl shadow-blue-900/20">
            <button onclick="window.closePinModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white bg-slate-700/50 rounded-full p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 id="pin-title" class="text-2xl font-black text-white mb-6 flex items-center gap-2 justify-center"></h3>
            <input type="password" inputmode="numeric" pattern="[0-9]*" id="login-pin" class="w-full bg-slate-900 border-2 border-slate-600 rounded-2xl px-4 py-5 text-white text-3xl font-black tracking-[0.5em] text-center focus:border-blue-500 focus:outline-none mb-6 shadow-inner" placeholder="****">
            <button onclick="window.verifyPin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-transform active:scale-95">Ingresar</button>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[200] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl w-full max-w-sm relative shadow-2xl space-y-4">
            <button onclick="window.closeEditModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white bg-slate-700/50 rounded-full p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-2xl font-black text-white mb-4">Editar Mortal</h3>
            <div><label class="text-[10px] font-black uppercase text-slate-400 block mb-1">Nombre</label><input type="text" id="edit-name" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-bold"></div>
            <div><label class="text-[10px] font-black uppercase text-slate-400 block mb-1">Peso Inicial (kg)</label><input type="number" step="0.1" id="edit-weight" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-bold"></div>
            <div><label class="text-[10px] font-black uppercase text-amber-400 block mb-1">Cambiar PIN</label><input type="password" inputmode="numeric" pattern="[0-9]*" id="edit-pin" class="w-full bg-slate-900 border border-amber-500/50 rounded-xl px-4 py-3 text-amber-400 font-bold tracking-[0.2em] text-center" placeholder="****"></div>
            <button onclick="window.saveEditModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl mt-4 shadow-lg">Guardar Cambios</button>
        </div>
    </div>

</body>
</html>
