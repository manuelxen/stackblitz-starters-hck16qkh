    <script>
        // Configuración de Firebase (Tu llave real)
        window.firebaseConfig = {
          apiKey: "AIzaSyA5N0yQQfPDfLKCkEbzUPHMMU-IJc6hCdA",
          authDomain: "app-de-ejercicio-a99db.firebaseapp.com",
          projectId: "app-de-ejercicio-a99db",
          storageBucket: "app-de-ejercicio-a99db.firebasestorage.app",
          messagingSenderId: "74777587908",
          appId: "1:74777587908:web:9ec006c45230a7e91c1991",
          measurementId: "G-XKXCW6P675"
        };

        window.START_DATE = new Date("2026-08-18T00:00:00");
        window.END_DATE = new Date("2026-10-30T00:00:00");
        window.TODAY = new Date();

        window.appState = {
            currentTab: 'home',
            allUsers: [],
            userData: null
        };

        window.showToast = function(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-sm font-bold shadow-lg z-50 animate-fade-in ${type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        };

        window.switchTab = function(tabId, userId = null) {
            window.appState.currentTab = tabId;
            if(userId) {
                window.appState.userData = window.appState.allUsers.find(u => u.id === userId);
            } else if (tabId === 'home') {
                window.appState.userData = null; 
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.add('text-blue-500');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-blue-500');
                    btn.classList.add('text-slate-500');
                }
            });
            if(window.renderApp) window.renderApp();
        };

        window.currentLoginUserId = null;

        // Modales de Seguridad y PIN
        window.promptPin = function(userId) {
            window.currentLoginUserId = userId;
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
        };

        window.closePinModal = function() {
            const modal = document.getElementById('pin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.currentLoginUserId = null;
        };

        window.verifyPin = function() {
            const pin = document.getElementById('login-pin').value;
            if(pin === '13579') { // CLAVE ADMIN
                window.closePinModal();
                window.switchTab('admin');
                return;
            }
            const user = window.appState.allUsers.find(u => u.id === window.currentLoginUserId);
            if(user && user.pin === pin) {
                window.closePinModal();
                window.switchTab('profile', user.id);
            } else {
                window.showToast("PIN Incorrecto.", "error");
                document.getElementById('login-pin').value = '';
            }
        };

        window.promptAdminPin = function() {
            window.currentLoginUserId = null;
            const modal = document.getElementById('pin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('login-pin').value = '';
            setTimeout(() => document.getElementById('login-pin').focus(), 100);
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const app = initializeApp(window.firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        window.db = db; 

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                listenToParticipants();
            } else {
                signInAnonymously(auth).catch(error => {
                    console.error("Auth error", error);
                    window.showToast("Error de conexión a la base de datos.", "error");
                });
            }
        });

        function listenToParticipants() {
            const competitorsRef = collection(db, 'competitors');
            onSnapshot(competitorsRef, (snapshot) => {
                const users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(!data.deleted) { // Ignorar los eliminados suavemente
                        users.push({ id: doc.id, ...data });
                    }
                });
                window.appState.allUsers = users;
                
                if(window.appState.userData) {
                    window.appState.userData = users.find(u => u.id === window.appState.userData.id);
                }
                if(window.renderApp) window.renderApp();
            }, (error) => {
                console.error("Error leyendo DB:", error);
            });
        }

        window.processRegistration = async function() {
            const name = document.getElementById('reg-name').value;
            const weight = parseFloat(document.getElementById('reg-weight').value);
            const height = parseFloat(document.getElementById('reg-height').value);
            const pin = document.getElementById('reg-pin').value;

            if(!name || !weight || !height || !pin) return window.showToast("Completa todos los campos", "error");
            if(pin.length !== 4) return window.showToast("El PIN debe ser de 4 dígitos", "error");

            const heightInMeters = height > 3 ? height / 100 : height;
            const imc = (weight / (heightInMeters * heightInMeters)).toFixed(1);
            const group = imc >= 25 ? 'A (Quemar)' : 'B (Volumen)';

            const newUserId = "user_" + Date.now();
            const newUserData = {
                id: newUserId,
                name: name,
                startWeight: weight,
                height: height,
                imc: parseFloat(imc),
                group: group,
                pin: pin.toString(),
                trainingDays: [],
                videos: { real: false, ropa: false },
                deleted: false,
                createdAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, 'competitors', newUserId), newUserData);
                window.showToast(`¡${name} inscrito correctamente!`);
                window.switchTab('home');
            } catch (error) {
                console.error("Error", error);
                window.showToast("Error guardando en Firestore.", "error");
            }
        };

        // Lógica de Webcam en Vivo para el Entrenamiento Diario (ANTI-TRAMPAS)
        let activeCameraCallback = null;

        window.openWebcamModal = function(callback) {
            activeCameraCallback = callback;
            const modal = document.getElementById('webcam-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(stream => {
                    window.localStream = stream;
                    const video = document.getElementById('webcam-video');
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => {
                    console.error("Webcam error:", err);
                    window.showToast("Debes dar permiso de cámara para el registro diario.", "error");
                    window.closeWebcamModal();
                });
        };

        window.closeWebcamModal = function() {
            if(window.localStream) {
                window.localStream.getTracks().forEach(track => track.stop());
                window.localStream = null;
            }
            const modal = document.getElementById('webcam-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            activeCameraCallback = null;
        };

        window.captureWebcamSnapshot = function() {
            window.showToast("Procesando evidencia de sudor... ⏳", "success");
            setTimeout(async () => {
                if(activeCameraCallback) {
                    await activeCameraCallback();
                }
                window.closeWebcamModal();
            }, 800);
        };

        window.handleLiveCapture = function(userId) {
            window.openWebcamModal(async () => {
                try {
                    const userRef = doc(window.db, 'competitors', userId);
                    const todayStr = new Date().toISOString().split('T')[0];
                    const user = window.appState.allUsers.find(u => u.id === userId);
                    if(user.trainingDays && user.trainingDays.includes(todayStr)) {
                        return window.showToast("Ya registraste tu entreno hoy.", "error");
                    }
                    // Usando un enfoque más directo en lugar de arrayUnion para evitar problemas de importación
                    const newDays = user.trainingDays ? [...user.trainingDays, todayStr] : [todayStr];
                    await updateDoc(userRef, { trainingDays: newDays });
                    window.showToast("¡Día Registrado! +1 Punto 🔥", "success");
                } catch (error) {
                    console.error("Save error", error);
                    window.showToast("Error de conexión.", "error");
                }
            });
        };

        // ACCESO A GALERÍA: Para videos de control (Realidad y Ropa)
        window.handleGalleryUpload = async function(type, userId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*,image/*'; // Sin el atributo "capture" esto abre la galería
            
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if(file) {
                    window.showToast("Subiendo archivo desde la galería... ⏳", "success");
                    try {
                        const userRef = doc(window.db, 'competitors', userId);
                        await updateDoc(userRef, { [`videos.${type}`]: true });
                        window.showToast("¡Archivo subido exitosamente! 📸", "success");
                    } catch(err) {
                        window.showToast("Error al guardar archivo.", "error");
                    }
                }
            };
            input.click();
        };

        // Panel Administrador (Borrado Suave y Edición)
        window.deleteCompetitor = async function(userId) {
            if(confirm("¿Seguro que deseas ELIMINAR a este competidor del Olimpo?")) {
                try {
                    const userRef = doc(window.db, 'competitors', userId);
                    await updateDoc(userRef, { deleted: true }); // Soft delete
                    window.showToast("Competidor borrado exitosamente.", "success");
                } catch(e) {
                    console.error("Error deleting", e);
                    window.showToast("Error al eliminar competidor.", "error");
                }
            }
        };

        window.openEditModal = function(userId) {
            const user = window.appState.allUsers.find(u => u.id === userId);
            if(!user) return;
            window.editingUserId = userId;
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-pin').value = user.pin;
            document.getElementById('edit-weight').value = user.startWeight;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditModal = function() {
            window.editingUserId = null;
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.saveEditModal = async function() {
            if(!window.editingUserId) return;
            const newName = document.getElementById('edit-name').value;
            const newPin = document.getElementById('edit-pin').value;
            const newWeight = document.getElementById('edit-weight').value;

            try {
                await updateDoc(doc(window.db, 'competitors', window.editingUserId), {
                    name: newName,
                    pin: newPin,
                    startWeight: parseFloat(newWeight)
                });
                window.showToast("Datos actualizados correctamente.", "success");
                window.closeEditModal();
            } catch (error) {
                window.showToast("Error actualizando datos.", "error");
            }
        };
    </script>

    <script>
        window.renderApp = function() {
            const main = document.getElementById('main-content');
            const diff = window.END_DATE - window.TODAY;
            const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').textContent = `${daysLeft > 0 ? daysLeft : 0} Días`;

            switch(window.appState.currentTab) {
                case 'home': renderDashboard(main); break;
                case 'onboarding': renderOnboarding(main); break;
                case 'profile': renderProfile(main); break;
                case 'ranking': renderRanking(main); break;
                case 'retos': renderRetos(main); break;
                case 'bases': renderBases(main); break;
                case 'admin': renderAdmin(main); break;
                default: renderDashboard(main);
            }
            if(window.lucide) window.lucide.createIcons();
        };

        function renderDashboard(container) {
            let html = `
                <div class="animate-fade-in pb-4">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-black text-white">Competidores</h2>
                            <p class="text-xs text-slate-400">Toca tu nombre para entrar y sudar</p>
                        </div>
                        <button onclick="window.switchTab('onboarding')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 font-bold text-sm transition-colors">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Añadir
                        </button>
                    </div>
            `;

            if(window.appState.allUsers.length === 0) {
                html += `
                    <div class="h-64 flex flex-col items-center justify-center text-center p-6 border-2 border-dashed border-slate-700 rounded-2xl">
                        <div class="bg-slate-800 p-4 rounded-full mb-4">
                            <i data-lucide="users" class="w-10 h-10 text-slate-400"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Ningún espartano aún</h3>
                        <button onclick="window.switchTab('onboarding')" class="px-6 py-3 bg-white text-black font-bold rounded-full shadow-lg mt-2">Inscribir al primero</button>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 gap-3">`;
                window.appState.allUsers.forEach(user => {
                    const days = user.trainingDays ? user.trainingDays.length : 0;
                    const imcColor = user.group.includes('A') ? 'text-blue-400' : 'text-emerald-400';
                    const groupLabel = user.group.includes('A') ? 'Gpo A' : 'Gpo B';
                    
                    html += `
                        <div onclick="window.promptPin('${user.id}')" class="glass-panel p-4 rounded-2xl flex items-center justify-between cursor-pointer border border-slate-700/50 hover:border-blue-500 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center border border-slate-600 text-xl font-black text-white shadow-inner">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg text-white leading-none">${user.name}</h3>
                                    <div class="flex gap-2 mt-2">
                                        <span class="text-[9px] bg-blue-900/40 border border-blue-500/30 px-2 py-0.5 rounded ${imcColor} font-bold tracking-wider">${groupLabel}</span>
                                        <span class="text-[9px] bg-slate-800 border border-slate-600 px-2 py-0.5 rounded text-slate-300 font-bold tracking-wider">IMC ${user.imc}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right flex flex-col items-end">
                                <div class="font-black text-3xl text-white leading-none drop-shadow-md">${days}</div>
                                <div class="text-[8px] uppercase font-black tracking-widest text-slate-500 mt-1">Pts</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html + `</div>`;
        }

        function renderOnboarding(container) {
            container.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl animate-fade-in border border-slate-700/50">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="window.switchTab('home')" class="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <h2 class="text-xl font-black text-white">Nuevo Competidor</h2>
                        <div class="w-9"></div>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nombre o Apodo</label>
                            <input type="text" id="reg-name" placeholder="Ej: Manuel..." class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Peso (Kg)</label>
                                <input type="number" id="reg-weight" step="0.1" placeholder="Ej: 85.5" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Altura (Metros)</label>
                                <input type="number" id="reg-height" step="0.01" placeholder="Ej: 1.75" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-1">
                                <i data-lucide="shield" class="w-3 h-3 text-amber-500"></i> PIN de Seguridad (4 Dígitos)
                            </label>
                            <input type="password" id="reg-pin" inputmode="numeric" maxlength="4" placeholder="••••" class="w-full bg-slate-900/80 border border-slate-700 text-amber-400 rounded-xl px-4 py-3 text-center text-2xl tracking-[0.5em] font-black focus:outline-none focus:border-amber-500 shadow-inner">
                            <p class="text-[9px] text-slate-500 mt-2 text-center">Nadie podrá ver tu perfil sin este PIN.</p>
                        </div>
                    </div>
                    <button onclick="window.processRegistration()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl mt-8 shadow-lg shadow-blue-900/50 flex justify-center items-center gap-2 text-lg transition-all">
                        Inscribirse al Reto
                    </button>
                </div>
            `;
        }

        function renderProfile(container) {
            const user = window.appState.userData;
            if(!user) return window.switchTab('home');

            const videoRealDone = user.videos && user.videos.real;
            const videoRopaDone = user.videos && user.videos.ropa;
            const points = user.trainingDays ? user.trainingDays.length : 0;

            const year = window.TODAY.getFullYear();
            const month = window.TODAY.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();

            let calendarGridHtml = '';
            const weekDays = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
            weekDays.forEach(d => {
                calendarGridHtml += `<div class="text-[10px] font-black text-slate-500 text-center py-1">${d}</div>`;
            });

            let offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 
            for(let i = 0; i < offset; i++) {
                calendarGridHtml += `<div></div>`;
            }

            for(let day = 1; day <= daysInMonth; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;
                const trained = user.trainingDays && user.trainingDays.includes(dateKey);

                calendarGridHtml += `
                    <div class="h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold relative border ${trained ? 'bg-blue-600 border-blue-400 text-white shadow-lg' : 'bg-slate-900/40 border-slate-800 text-slate-400'}">
                        <span>${day}</span>
                        ${trained ? '<span class="absolute -bottom-2 -right-1 text-sm drop-shadow-md">🏋️</span>' : ''}
                    </div>
                `;
            }

            const mesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            container.innerHTML = `
                <div class="animate-fade-in pb-8">
                    <button onclick="window.switchTab('home')" class="mb-4 flex items-center gap-2 text-sm text-slate-400 font-bold hover:text-white transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
                    </button>

                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-3xl border border-slate-700 mb-6 shadow-xl relative overflow-hidden">
                        <div class="flex justify-between items-start mb-1 relative z-10">
                            <div>
                                <h2 class="text-3xl font-black text-white leading-tight">${user.name}</h2>
                                <div class="flex gap-2 mt-2">
                                    <span class="bg-blue-600/20 text-blue-400 text-[10px] px-2 py-1 rounded border border-blue-500/20 font-bold uppercase tracking-wider">Grupo: ${user.group}</span>
                                    <span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider">${user.startWeight} Kg</span>
                                </div>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-center shadow-inner">
                                <div class="text-3xl font-black text-blue-500 leading-none">${points}</div>
                                <div class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mt-1">SUDOR (PTS)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Botón Gigante de Entrenamiento (ANTI-TRAMPAS EN VIVO) -->
                    <button onclick="window.handleLiveCapture('${user.id}')" class="w-full bg-gradient-to-r from-red-600 to-red-500 text-white font-black py-5 rounded-2xl mb-6 shadow-lg shadow-red-900/30 flex justify-center items-center gap-3 text-lg border border-red-400/50 hover:from-red-500 hover:to-red-400 transition-all active:scale-95">
                        <i data-lucide="flame" class="w-6 h-6"></i> ¡REGISTRAR SUDOR HOY!
                    </button>

                    <!-- Archivos de Control (GALERÍA PERMITIDA) -->
                    <div class="glass-panel p-5 rounded-2xl mb-6 border border-slate-700/50 shadow-lg">
                        <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <i data-lucide="folder-open" class="w-4 h-4"></i> Pruebas de Control (Galería)
                        </h3>
                        <div class="space-y-3">
                            <div class="bg-slate-900/80 border ${videoRealDone ? 'border-emerald-500/50' : 'border-slate-600'} p-3 rounded-xl flex justify-between items-center transition-colors">
                                <div>
                                    <div class="text-sm font-bold text-white flex items-center gap-2">
                                        Video "Realidad" ${videoRealDone ? '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>' : ''}
                                    </div>
                                    <div class="text-[10px] text-slate-400">Sin polo (Giro 360º)</div>
                                </div>
                                ${!videoRealDone ? `<button onclick="window.handleGalleryUpload('real', '${user.id}')" class="bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors"><i data-lucide="upload" class="w-3 h-3 text-blue-400"></i> Subir</button>` : `<span class="text-xs font-bold text-emerald-500 bg-emerald-900/30 px-3 py-1.5 rounded-lg border border-emerald-500/30">Listo</span>`}
                            </div>
                            <div class="bg-slate-900/80 border ${videoRopaDone ? 'border-emerald-500/50' : 'border-slate-600'} p-3 rounded-xl flex justify-between items-center transition-colors">
                                <div>
                                    <div class="text-sm font-bold text-white flex items-center gap-2">
                                        Video "Ropa Control" ${videoRopaDone ? '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>' : ''}
                                    </div>
                                    <div class="text-[10px] text-slate-400">Prenda mal ajustada</div>
                                </div>
                                ${!videoRopaDone ? `<button onclick="window.handleGalleryUpload('ropa', '${user.id}')" class="bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors"><i data-lucide="upload" class="w-3 h-3 text-blue-400"></i> Subir</button>` : `<span class="text-xs font-bold text-emerald-500 bg-emerald-900/30 px-3 py-1.5 rounded-lg border border-emerald-500/30">Listo</span>`}
                            </div>
                        </div>
                    </div>

                    <div class="glass-panel p-5 rounded-2xl border border-slate-700/50">
                        <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 flex items-center justify-between">
                            <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> Mes de ${mesNombres[month]}</span>
                        </h3>
                        <div class="grid grid-cols-7 gap-1">
                            ${calendarGridHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRanking(container) {
            let sortedUsers = [...window.appState.allUsers].sort((a, b) => {
                const aPoints = a.trainingDays ? a.trainingDays.length : 0;
                const bPoints = b.trainingDays ? b.trainingDays.length : 0;
                return bPoints - aPoints;
            });

            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="text-center mb-8">
                        <i data-lucide="trophy" class="w-12 h-12 text-amber-400 mx-auto mb-2 drop-shadow-[0_0_15px_rgba(251,191,36,0.4)]"></i>
                        <h2 class="text-2xl font-black text-white">Salón del Olimpo</h2>
                        <p class="text-xs text-slate-400">Clasificación por Constancia</p>
                    </div>
                    <div class="space-y-3">
            `;

            sortedUsers.forEach((user, index) => {
                const points = user.trainingDays ? user.trainingDays.length : 0;
                let positionStyle = "bg-slate-800 text-slate-400 border-slate-700";
                if(index === 0) positionStyle = "bg-amber-400 text-black border-amber-300 shadow-[0_0_15px_rgba(251,191,36,0.3)]";
                else if(index === 1) positionStyle = "bg-slate-300 text-black border-slate-200";
                else if(index === 2) positionStyle = "bg-amber-700 text-white border-amber-600";
                
                // Los peores
                if(index >= sortedUsers.length - 2 && sortedUsers.length > 3) positionStyle = "bg-red-900/50 text-red-400 border-red-800";

                html += `
                    <div class="glass-panel flex items-center p-3 rounded-2xl border border-slate-700/50">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-lg border ${positionStyle} flex-shrink-0 z-10">
                            ${index + 1}
                        </div>
                        <div class="ml-4 flex-grow">
                            <h3 class="font-bold text-white text-lg leading-none">${user.name}</h3>
                            <div class="text-[10px] text-slate-400 mt-1 uppercase font-bold">${user.group}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-2xl text-white leading-none">${points}</div>
                            <div class="text-[8px] uppercase font-bold text-slate-500">Pts</div>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderBases(container) {
            container.innerHTML = `
                <div class="animate-fade-in pb-8">
                    <h2 class="text-2xl font-black text-white mb-2">Bases del Reto</h2>
                    <p class="text-xs text-slate-400 mb-6">Reglamento Oficial: 18 Agosto - 30 Octubre</p>
                    
                    <div class="space-y-4">
                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="font-black text-white text-sm flex items-center gap-2 mb-2"><i data-lucide="droplet" class="w-4 h-4 text-blue-400"></i> 1. El Sudor Diario (Constancia)</h3>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                <strong>+1 Punto</strong> por cada día de entrenamiento validado en la app.<br><br>
                                <span class="text-red-400 font-bold">REGLA ANTI-TRAMPAS:</span> La foto diaria debe tomarse con la cámara EN VIVO de la app. Prohibida la galería. En la auditoría final (30 Oct), si alguien te descubre una foto repetida/falsa, <strong>pierdes 2 puntos.</strong>
                            </p>
                        </div>

                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="font-black text-white text-sm flex items-center gap-2 mb-2"><i data-lucide="scale" class="w-4 h-4 text-emerald-400"></i> 2. El Peso Justo</h3>
                            <p class="text-xs text-slate-300 leading-relaxed mb-3">
                                Se evalúa el % de cambio de peso según tu grupo para que sea justo para flacos y gordos.
                            </p>
                            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 mb-2">
                                <span class="text-[10px] font-black text-blue-400">GRUPO A (Bajar Grasa):</span>
                                <ul class="text-[10px] text-slate-400 mt-1 list-disc pl-4 space-y-1">
                                    <li>Bajar entre 3% y 5% = 10 Puntos</li>
                                    <li>Bajar entre 5.1% y 8% = 15 Puntos</li>
                                    <li>Bajar más del 8% = 20 Puntos</li>
                                </ul>
                            </div>
                            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                                <span class="text-[10px] font-black text-emerald-400">GRUPO B (Volumen Limpio):</span>
                                <ul class="text-[10px] text-slate-400 mt-1 list-disc pl-4 space-y-1">
                                    <li>Subir entre 2% y 4% = 15 Puntos (Premia volumen limpio)</li>
                                    <li>Subir más del 4% = 10 Puntos (Mucha grasa)</li>
                                </ul>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                            <h3 class="font-black text-white text-sm flex items-center gap-2 mb-2"><i data-lucide="video" class="w-4 h-4 text-purple-400"></i> 3. La Métrica Visual (Videos)</h3>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                El espejo no miente. El Día 1 y el Día Final grabaremos 2 videos de control:
                                <br><br><strong>Video Realidad:</strong> Sin polo, en short (giro de 360º).
                                <br><strong>Video Ropa:</strong> Con una prenda que te quede mal hoy.
                                <br><br>Se guardan ocultos hasta el 30 de Octubre.
                            </p>
                        </div>

                        <div class="bg-slate-800 p-5 rounded-2xl border border-amber-700/50 relative overflow-hidden">
                            <div class="absolute right-0 top-0 opacity-10"><i data-lucide="gavel" class="w-24 h-24"></i></div>
                            <h3 class="font-black text-amber-400 text-sm flex items-center gap-2 mb-2">4. El Veredicto Final</h3>
                            <p class="text-xs text-slate-300 leading-relaxed relative z-10">
                                El 30 de Octubre nos reunimos. Se suma la Constancia + Los Puntos de Peso. <br><br>
                                Finalmente, la <strong>Votación Estética:</strong> Proyectaremos los videos del Antes y Después. Todos votarán del 1 al 5 el cambio visual de sus compañeros.
                                <br><br>Los 2 últimos... <span class="text-red-400 font-bold">PAGAN PENITENCIA.</span>💀
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRetos(container) {
            container.innerHTML = `
                <div class="animate-fade-in pb-8">
                    <h2 class="text-2xl font-black text-white mb-2">Retos Especiales</h2>
                    <p class="text-xs text-slate-400 mb-6">Puntos extra para la gloria</p>

                    <div class="bg-gradient-to-br from-orange-900 to-red-900 p-6 rounded-3xl border border-orange-500/50 shadow-2xl relative overflow-hidden">
                        <i data-lucide="drumstick" class="absolute -right-4 -bottom-4 w-32 h-32 text-orange-500/20"></i>
                        <h3 class="text-xl font-black text-white mb-2 relative z-10">El Rey de la Proteína 🥩</h3>
                        <p class="text-sm text-orange-200 mb-4 relative z-10">
                            Para evitar perder músculo (Grupo A) o para construir volumen (Grupo B).
                        </p>
                        <div class="bg-black/30 p-4 rounded-xl relative z-10 border border-orange-500/30">
                            <p class="text-xs text-white font-bold mb-2">Misión:</p>
                            <p class="text-xs text-slate-300">
                                Sube al grupo de WhatsApp 1 foto de tus almuerzos o cenas demostrando que estás comiendo buena proteína (pollo, carne, huevos, etc).
                            </p>
                            <div class="mt-4 flex justify-between items-center border-t border-white/10 pt-3">
                                <span class="text-[10px] text-orange-300 uppercase font-black tracking-widest">Recompensa</span>
                                <span class="bg-orange-500 text-white font-black px-3 py-1 rounded text-sm shadow-lg">+4 PTS</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdmin(container) {
            let html = `
                <div class="animate-fade-in pb-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-black text-amber-400 flex items-center gap-2">
                            <i data-lucide="shield-check" class="w-6 h-6"></i> Admin
                        </h2>
                        <button onclick="window.switchTab('home')" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">Salir</button>
                    </div>
                    <div class="space-y-3">
            `;

            window.appState.allUsers.forEach(user => {
                html += `
                    <div class="glass-panel p-4 rounded-2xl border border-slate-700/50 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-white">${user.name}</h3>
                            <div class="text-[10px] text-slate-400 mt-1">PIN: <span class="text-amber-400 tracking-widest font-black">${user.pin}</span></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.openEditModal('${user.id}')" class="bg-blue-900/30 text-blue-400 border border-blue-800 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 transition-colors">
                                <i data-lucide="edit-2" class="w-4 h-4"></i> Editar
                            </button>
                            <button onclick="window.deleteCompetitor('${user.id}')" class="bg-red-900/30 text-red-400 border border-red-800 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Borrar
                            </button>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
        }

        setTimeout(renderApp, 100);
    </script>
</body>
</html>
